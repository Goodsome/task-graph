# yaml-language-server: $schema=./codegen.schema.json
contexts:
- application:
    use_cases:
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      - name: event_publisher
        type: IssueEventPublisher
      description: Link an issue to a task from Planning context
      inputs:
      - name: issue_id
        type: string
      - name: task_id
        type: string
      kind: command
      name: LinkIssueToTask
      outputs:
      - name: success
        type: boolean
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      - name: event_publisher
        type: IssueEventPublisher
      description: Close an issue that is in RESOLVED status
      inputs:
      - name: issue_id
        type: string
      - name: resolution
        optional: true
        type: string
      kind: command
      name: CloseIssue
      outputs:
      - name: success
        type: boolean
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      - name: event_publisher
        type: IssueEventPublisher
      - name: status_transition_service
        type: IssueStatusTransitionService
      description: Update issue status with state machine validation
      inputs:
      - name: issue_id
        type: string
      - name: new_status
        type: IssueStatus
      - name: changed_by
        type: string
      kind: command
      name: UpdateIssueStatus
      outputs:
      - name: success
        type: boolean
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      description: Get full issue details including comments and labels
      inputs:
      - name: issue_id
        type: string
      kind: query
      name: GetIssueDetails
      outputs:
      - name: success
        type: boolean
      - name: issue
        optional: true
        type: dict
      - name: error
        optional: true
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      - name: event_publisher
        type: IssueEventPublisher
      description: Create a new issue with initial status NEW
      inputs:
      - name: title
        type: string
      - name: description
        type: string
      - name: type
        type: IssueType
      - name: severity
        type: Severity
      - name: submitter_name
        type: string
      - name: submitter_email
        type: string
      kind: command
      name: CreateIssue
      outputs:
      - name: success
        type: boolean
      - name: issue_id
        type: string
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      - name: event_publisher
        type: IssueEventPublisher
      description: Update issue metadata like type, severity, and labels
      inputs:
      - name: issue_id
        type: string
      - name: type
        optional: true
        type: IssueType
      - name: severity
        optional: true
        type: Severity
      - container: list
        name: add_labels
        optional: true
        type: string
      - container: list
        name: remove_labels
        optional: true
        type: string
      kind: command
      name: UpdateIssueMetadata
      outputs:
      - name: success
        type: boolean
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      description: Paginated list of issues with filtering
      inputs:
      - name: status
        optional: true
        type: IssueStatus
      - name: type
        optional: true
        type: IssueType
      - container: list
        name: labels
        optional: true
        type: string
      - default: 10
        name: limit
        type: integer
      - default: 0
        name: offset
        type: integer
      kind: query
      name: ListIssues
      outputs:
      - container: list
        name: issues
        type: dict
      - name: total_count
        type: integer
      - name: error
        optional: true
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      - name: event_publisher
        type: IssueEventPublisher
      description: Unlink an issue from a task
      inputs:
      - name: issue_id
        type: string
      - name: task_id
        type: string
      kind: command
      name: UnlinkIssueFromTask
      outputs:
      - name: success
        type: boolean
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: issue_repository
        type: IssueRepository
      - name: event_publisher
        type: IssueEventPublisher
      description: Add a comment to an issue
      inputs:
      - name: issue_id
        type: string
      - name: content
        type: string
      - name: author
        type: string
      kind: command
      name: AddComment
      outputs:
      - name: success
        type: boolean
      - name: comment_id
        type: string
      - default: ''
        name: error
        type: string
  domain:
    aggregates:
    - attributes:
      - name: id
        type: IssueId
      - name: title
        type: IssueTitle
      - name: description
        type: IssueDescription
      - name: type
        type: IssueType
      - name: severity
        type: Severity
      - name: status
        type: IssueStatus
      - name: submitter
        type: Submitter
      - container: list
        name: labels
        type: Label
      - container: list
        name: comments
        type: Comment
      - container: list
        name: task_links
        type: TaskLink
      - name: created_at
        type: datetime
      - name: updated_at
        type: datetime
      behaviors:
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: title
          type: string
        - name: description
          type: string
        - name: type
          type: IssueType
        - name: severity
          type: Severity
        - name: submitter
          type: Submitter
        name: create
        output:
          type: Self
      - inputs:
        - name: self
          type: Self
        - name: new_status
          type: IssueStatus
        - name: changed_by
          type: string
        name: change_status
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        - name: resolution
          optional: true
          type: string
        name: close
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        - name: content
          type: string
        - name: author
          type: string
        name: add_comment
        output:
          type: Comment
      - inputs:
        - name: self
          type: Self
        - name: label
          type: Label
        name: add_label
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        - name: label_name
          type: string
        name: remove_label
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        - name: task_id
          type: string
        name: link_to_task
        output:
          type: TaskLink
      - inputs:
        - name: self
          type: Self
        - name: task_id
          type: string
        name: unlink_from_task
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        - name: type
          optional: true
          type: IssueType
        - name: severity
          optional: true
          type: Severity
        name: update_metadata
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        name: reconstitute
        output:
          type: Self
      - inputs:
        - name: self
          type: Self
        name: to_dict
        output:
          type: dict
      description: Issue aggregate root managing the complete issue lifecycle
      name: Issue
    entities:
    - attributes:
      - name: id
        type: CommentId
      - name: content
        type: string
      - name: author
        type: string
      - name: created_at
        type: datetime
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: content
          type: string
        - name: author
          type: string
        name: create
        output:
          type: Comment
      description: Comment attached to an Issue, immutable after creation
      name: Comment
    enums:
    - description: Classification of issue types
      members:
      - name: BUG
        value: bug
      - name: FEATURE
        value: feature
      - name: QUESTION
        value: question
      - name: IMPROVEMENT
        value: improvement
      name: IssueType
    - description: Severity level of an issue
      members:
      - name: CRITICAL
        value: critical
      - name: MAJOR
        value: major
      - name: MINOR
        value: minor
      - name: LOW
        value: low
      name: Severity
    - description: Lifecycle state of an issue
      members:
      - name: NEW
        value: new
      - name: TRIAGED
        value: triaged
      - name: IN_PROGRESS
        value: in_progress
      - name: RESOLVED
        value: resolved
      - name: CLOSED
        value: closed
      name: IssueStatus
    ports:
    - aggregate: Issue
      description: Persistence interface for Issue aggregate
      kind: repository
      name: IssueRepository
      operations:
      - inputs:
        - name: self
          type: Self
        - name: issue
          type: Issue
        name: save
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        - name: issue_id
          type: IssueId
        name: find_by_id
        output:
          optional: true
          type: Issue
      - inputs:
        - name: self
          type: Self
        - name: status
          optional: true
          type: IssueStatus
        - name: issue_type
          optional: true
          type: IssueType
        - name: severity
          optional: true
          type: Severity
        - container: list
          name: labels
          optional: true
          type: string
        - name: limit
          type: integer
        - name: offset
          type: integer
        name: find_all
        output:
          container: list
          type: Issue
      - inputs:
        - name: self
          type: Self
        - name: issue_id
          type: IssueId
        name: delete
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        - name: task_id
          type: string
        name: find_by_task_id
        output:
          container: list
          type: Issue
      - inputs:
        - name: self
          type: Self
        - name: status
          optional: true
          type: IssueStatus
        - name: issue_type
          optional: true
          type: IssueType
        name: count
        output:
          type: integer
    - description: Publisher for Issue domain events
      kind: adapter
      name: IssueEventPublisher
      operations:
      - inputs:
        - name: self
          type: Self
        - name: event
          type: DomainEvent
        name: publish
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        - container: list
          name: events
          type: DomainEvent
        name: publish_all
        output:
          type: None
    services:
    - description: Validates issue status transitions according to state machine rules
      name: IssueStatusTransitionService
      operations:
      - inputs:
        - name: self
          type: Self
        - name: current_status
          type: IssueStatus
        - name: target_status
          type: IssueStatus
        name: can_transition
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        - name: current_status
          type: IssueStatus
        - name: target_status
          type: IssueStatus
        name: validate_transition
        output:
          type: None
    value_objects:
    - attributes:
      - name: value
        type: string
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: value
          type: string
        name: create
        output:
          type: IssueTitle
      - inputs:
        - name: self
          type: Self
        name: serialize
        output:
          type: string
      description: Title of an issue, max 200 characters
      name: IssueTitle
    - attributes:
      - name: value
        type: uuid
      behaviors:
      - inputs:
        - name: self
          type: Self
        name: create
        output:
          type: CommentId
      - inputs:
        - name: self
          type: Self
        - custom_type_string: Union[UUID, str]
          name: value
          type: Any
        name: reconstitute
        output:
          type: CommentId
      - inputs:
        - name: self
          type: Self
        name: __str__
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        name: serialize
        output:
          type: string
      description: Unique identifier for a Comment
      name: CommentId
    - attributes:
      - name: value
        type: string
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: value
          type: string
        name: create
        output:
          type: IssueDescription
      - inputs:
        - name: self
          type: Self
        name: serialize
        output:
          type: string
      description: Description of an issue, max 10000 characters
      name: IssueDescription
    - attributes:
      - name: name
        type: string
      - name: color
        optional: true
        type: string
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: name
          type: string
        - name: color
          optional: true
          type: string
        name: create
        output:
          type: Label
      description: Label for categorizing issues
      name: Label
    - attributes:
      - name: value
        type: uuid
      behaviors:
      - inputs:
        - name: self
          type: Self
        name: create
        output:
          type: IssueId
      - inputs:
        - name: self
          type: Self
        - name: value
          type: uuid
        name: reconstitute
        output:
          type: IssueId
      - inputs:
        - name: self
          type: Self
        name: __str__
        output:
          type: string
      - inputs:
        - name: self
          type: Self
        name: serialize
        output:
          type: string
      description: Unique identifier for an Issue
      name: IssueId
    - attributes:
      - name: task_id
        type: string
      - name: linked_at
        type: datetime
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: task_id
          type: string
        name: create
        output:
          type: TaskLink
      description: Link between an Issue and a Task from Planning context
      name: TaskLink
    - attributes:
      - name: name
        type: string
      - name: email
        type: string
      - name: external_id
        optional: true
        type: string
      behaviors:
      - inputs:
        - name: self
          type: Self
        - name: name
          type: string
        - name: email
          type: string
        - name: external_id
          optional: true
          type: string
        name: create
        output:
          type: Self
      - inputs:
        - name: self
          type: Self
        - name: email
          type: string
        name: validate_email
        output:
          type: string
      description: Information about the issue submitter
      name: Submitter
  infrastructure:
    implementations:
    - attributes:
      - name: session
        type: Session
      description: SQLAlchemy implementation of IssueRepository
      implements: IssueRepository
      name: SqlAlchemyIssueRepository
      private_methods:
      - inputs:
        - name: self
          type: Self
        - name: model
          type: IssueModel
        name: _to_domain
        output:
          type: Issue
      - inputs:
        - name: self
          type: Self
        - name: issue
          type: Issue
        - name: session
          type: Session
        name: _to_model
        output:
          type: IssueModel
      technology: sql
    - attributes:
      - name: connection
        type: Connection
      description: PostgreSQL NOTIFY implementation of IssueEventPublisher
      implements: IssueEventPublisher
      name: PostgresNotifyEventPublisher
      technology: postgres
  name: IssueTracking
- application:
    use_cases:
    - dependencies:
      - name: uow
        type: UnitOfWork
      description: Submit task execution result with artifacts and optional error.
        Updates task.output.
      inputs:
      - name: task_id
        type: string
      - name: summary
        type: string
      - container: list
        default: list
        name: artifacts
        type: string
      - name: error
        optional: true
        type: string
      kind: command
      name: SubmitTaskResult
      outputs:
      - name: success
        type: boolean
      - name: error
        optional: true
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      description: Create task
      inputs:
      - name: project_id
        type: string
      - name: name
        type: string
      - name: description
        type: string
      - name: effort
        type: integer
      - name: base_value
        type: float
      - name: planning_level
        type: PlanningLevel
      - default: CompletionLogic.ALL
        name: completion_logic
        type: CompletionLogic
      - container: list
        default: list
        name: dependencies
        type: string
      kind: command
      name: CreateTask
      outputs:
      - name: success
        type: boolean
      - name: task_id
        type: string
      - name: error
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      - name: resolution_service
        type: DependencyResolutionService
      description: Updates a task's status and triggers chain reactions for dependents.
      inputs:
      - name: task_id
        type: string
      - name: new_status
        type: string
      kind: command
      name: UpdateTaskStatus
      outputs:
      - name: success
        type: boolean
      - container: list
        name: affected_tasks
        type: string
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      - name: priority_service
        type: PriorityAnalysisService
      description: Returns the highest priority tasks that are ready to execute.
      inputs:
      - name: top_n
        type: integer
      - name: project_id
        optional: true
        type: string
      kind: query
      name: SuggestNextAction
      outputs:
      - container: list
        name: tasks
        type: Task
    - dependencies:
      - name: uow
        type: UnitOfWork
      description: Use case to get details of a specific task.
      inputs:
      - name: task_id
        type: string
      kind: query
      name: GetTaskDetails
      outputs:
      - name: success
        type: boolean
      - container: map
        name: task
        optional: true
        type: any
      - name: error
        optional: true
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      - name: resolution_service
        type: DependencyResolutionService
      inputs:
      - name: task_id
        type: string
      - name: approved
        type: boolean
      - name: feedback
        type: string
      kind: command
      name: ReviewTask
      outputs:
      - name: success
        type: boolean
      - name: task_id
        type: string
      - container: list
        default: list
        name: affected_tasks
        type: string
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      inputs:
      - name: task_id
        type: string
      kind: command
      name: DeleteTask
      outputs:
      - name: success
        type: boolean
      - default: ''
        name: error
        optional: true
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      - name: cycle_detector
        type: CycleDetectionService
      - name: dependency_resolver
        type: DependencyResolutionService
      inputs:
      - name: task_id
        type: string
      - container: list
        default: list
        name: added_dependencies
        type: string
      - container: list
        default: list
        name: removed_dependencies
        type: string
      kind: command
      name: ModifyTaskDependencies
      outputs:
      - name: success
        type: boolean
      - default: str
        name: error
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      description: Revise a task's details like name, description, effort, or base
        value.
      inputs:
      - name: task_id
        type: string
      - name: name
        optional: true
        type: string
      - name: description
        optional: true
        type: string
      - name: effort
        optional: true
        type: integer
      - name: base_value
        optional: true
        type: float
      kind: command
      name: ReviseTaskDetails
      outputs:
      - name: success
        type: boolean
      - default: ''
        name: error
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      - name: dependency_service
        type: DependencyResolutionService
      inputs:
      - name: task_id
        type: string
      - default: str
        name: executor_id
        type: string
      kind: command
      name: ClaimTask
      outputs:
      - name: success
        type: boolean
      - name: task_id
        type: string
      - default: str
        name: error
        type: string
      - default: str
        name: error_code
        type: string
    - dependencies:
      - name: uow
        type: UnitOfWork
      inputs:
      - name: project_id
        optional: true
        type: string
      - default: 1
        name: page
        type: integer
      - default: 10
        name: page_size
        type: integer
      - name: status
        optional: true
        type: TaskStatus
      - name: planning_level
        optional: true
        type: PlanningLevel
      - default: ''
        name: search
        optional: true
        type: string
      kind: query
      name: ListTasks
      outputs:
      - container: list
        name: tasks
        type: dict
      - name: total_count
        type: integer
      - name: total_pages
        type: integer
      - name: current_page
        type: integer
      - name: error
        optional: true
        type: string
  domain:
    aggregates:
    - attributes:
      - name: id
        type: TaskId
      - name: project_id
        type: string
      - name: name
        type: string
      - name: description
        type: string
      - name: status
        type: TaskStatus
      - name: completion_logic
        type: CompletionLogic
      - name: effort
        type: StoryPoint
      - name: base_value
        type: ValueScore
      - container: set
        name: dependencies
        type: TaskId
      - container: set
        default: set
        name: dependents
        type: TaskId
      - name: planning_level
        type: PlanningLevel
      - name: recurrence
        optional: true
        type: RecurrencePolicy
      - name: output
        optional: true
        type: TaskOutput
      - name: review_feedback
        optional: true
        type: ReviewFeedback
      behaviors:
      - description: Factory method to create a new Task
        inputs:
        - container: type
          name: cls
          type: Self
        - name: project_id
          type: string
        - name: name
          type: string
        - name: description
          type: string
        - name: effort
          type: StoryPoint
        - name: base_value
          type: ValueScore
        - name: completion_logic
          type: CompletionLogic
        - container: set
          name: dependencies
          type: TaskId
        - custom_type_string: Union[str, PlanningLevel]
          name: planning_level
          type: Any
        name: create
        output:
          type: Task
      - inputs:
        - container: type
          name: cls
          type: Self
        - name: task_id
          type: string
        - name: project_id
          type: string
        - name: name
          type: string
        - name: description
          type: string
        - custom_type_string: Union[TaskStatus, str]
          name: status
          type: Any
        - custom_type_string: Union[StoryPoint, int]
          name: effort
          type: Any
        - custom_type_string: Union[ValueScore, float]
          name: base_value
          type: Any
        - custom_type_string: Union[CompletionLogic, str]
          name: completion_logic
          type: Any
        - custom_type_string: Union[set[str], set[TaskId]]
          name: dependencies
          type: Any
        - custom_type_string: Union[PlanningLevel, str]
          name: planning_level
          type: Any
        - name: output
          optional: true
          type: TaskOutput
        - name: review_feedback
          optional: true
          type: ReviewFeedback
        name: reconstitute
        output:
          type: any
      - inputs:
        - name: self
          type: Self
        name: to_dict
        output:
          type: dict
      - description: Returns a simplified dictionary representation for listing.
        inputs:
        - name: self
          type: Self
        name: to_summary_dict
        output:
          type: dict
      - description: "将任务标记为 READY（依赖已满足，可被领取）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 PENDING 或 BLOCKED"
        inputs:
        - name: self
          type: Self
        name: mark_ready
        output:
          type: None
      - description: "将任务标记为 PENDING（新增了未满足的依赖）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 READY"
        inputs:
        - name: self
          type: Self
        name: mark_pending
        output:
          type: None
      - description: "领取任务开始执行。\n\nRaises:\n    TaskNotClaimableError: 当前状态不是 READY\
          \ 或 CHANGES_REQUESTED"
        inputs:
        - name: self
          type: Self
        name: claim
        output:
          type: None
      - description: "设置任务执行结果。\n\nRaises:\n    IllegalStateTransitionError: 当前状态不是\
          \ IN_PROGRESS"
        inputs:
        - name: self
          type: Self
        - name: output
          type: TaskOutput
        name: set_output
        output:
          type: None
      - description: "直接标记任务完成（用于手动/自动完成场景）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不允许直接完成"
        inputs:
        - name: self
          type: Self
        name: mark_completed
        output:
          type: None
      - description: "验证任务并记录反馈。\n\nArgs:\n    approved: 是否通过\n    feedback: 详细评价意见\n\
          Raises:\n    IllegalStateTransitionError: 如果当前状态不是 REVIEW"
        inputs:
        - name: self
          type: Self
        - name: approved
          type: boolean
        - name: feedback
          type: string
        name: review
        output:
          type: None
      - inputs:
        - name: self
          type: Self
        name: is_done
        output:
          type: boolean
      - inputs:
        - name: self
          type: Self
        name: is_claimable
        output:
          type: boolean
