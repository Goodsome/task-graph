# yaml-language-server: $schema=./codegen.schema.json
name: TaskGraph
contexts:
- name: IssueTracking
  domain:
    aggregates:
    - name: Issue
      description: Issue aggregate root managing the complete issue lifecycle
      attributes:
      - type: IssueId
        name: id
      - type: IssueTitle
        name: title
      - type: IssueDescription
        name: description
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: IssueStatus
        name: status
      - type: Submitter
        name: submitter
      - type: Label
        container: list
        name: labels
      - type: Comment
        container: list
        name: comments
      - type: TaskLink
        container: list
        name: task_links
      - type: datetime
        name: created_at
      - type: datetime
        name: updated_at
      behaviors:
      - name: create
        description: Create a new Issue aggregate
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: title
        - type: string
          name: description
        - type: IssueType
          name: issue_type
        - type: Severity
          name: severity
        - type: Submitter
          name: submitter
        output:
          type: Self
      - name: change_status
        description: Change issue status with audit trail
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: new_status
        - type: string
          name: changed_by
        output:
          type: None
      - name: close
        description: Close the issue with optional resolution note
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: resolution
        output:
          type: None
      - name: add_comment
        description: Add a comment to the issue
        inputs:
        - type: Self
          name: self
        - type: string
          name: content
        - type: string
          name: author
        output:
          type: Comment
      - name: add_label
        description: Add a label to the issue (duplicates ignored)
        inputs:
        - type: Self
          name: self
        - type: Label
          name: label
        output:
          type: None
      - name: remove_label
        description: Remove a label from the issue by name
        inputs:
        - type: Self
          name: self
        - type: string
          name: label_name
        output:
          type: None
      - name: link_to_task
        description: Link this issue to a planning task
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: TaskLink
      - name: unlink_from_task
        description: Remove link to a planning task
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: None
      - name: update_metadata
        description: Update issue type and/or severity
        inputs:
        - type: Self
          name: self
        - type: IssueType
          optional: true
          name: issue_type
        - type: Severity
          optional: true
          name: severity
        output:
          type: None
    enums:
    - name: IssueType
      description: Classification of issue types
      members:
      - name: BUG
        value: bug
      - name: FEATURE
        value: feature
      - name: QUESTION
        value: question
      - name: IMPROVEMENT
        value: improvement
    - name: Severity
      description: Severity level of an issue
      members:
      - name: CRITICAL
        value: critical
      - name: MAJOR
        value: major
      - name: MINOR
        value: minor
      - name: LOW
        value: low
    - name: IssueStatus
      description: Lifecycle state of an issue
      members:
      - name: REPORTED
        value: reported
      - name: TRIAGED
        value: triaged
      - name: IN_PROGRESS
        value: in_progress
      - name: RESOLVED
        value: resolved
      - name: CLOSED
        value: closed
    value_objects:
    - name: IssueTitle
      description: Title of an issue, max 200 characters
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: IssueTitle
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: CommentId
      description: Unique identifier for a Comment
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          name: self
        output:
          type: CommentId
      - name: reconstitute
        inputs:
        - type: Self
          name: self
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: CommentId
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: IssueDescription
      description: Description of an issue, max 10000 characters
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: IssueDescription
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: Label
      description: Label for categorizing issues
      attributes:
      - type: string
        name: name
      - type: string
        optional: true
        name: color
      behaviors:
      - name: create
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        - type: string
          optional: true
          name: color
        output:
          type: Label
    - name: IssueId
      description: Unique identifier for an Issue
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: IssueId
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: uuid
          name: value
        output:
          type: IssueId
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: TaskLink
      description: Link between an Issue and a Task from Planning context
      attributes:
      - type: string
        name: task_id
      - type: datetime
        name: linked_at
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: task_id
        output:
          type: TaskLink
    - name: Submitter
      description: Information about the issue submitter
      attributes:
      - type: string
        name: name
      - type: string
        name: email
      - type: string
        optional: true
        name: external_id
      behaviors:
      - name: create
        inputs:
        - type: Self
          name: self
        - type: string
          name: name
        - type: string
          name: email
        - type: string
          optional: true
          name: external_id
        output:
          type: Self
      - name: validate_email
        inputs:
        - type: Self
          name: self
        - type: string
          name: email
        output:
          type: string
    entities:
    - name: Comment
      description: Comment attached to an Issue, immutable after creation
      attributes:
      - type: CommentId
        name: id
      - type: string
        name: content
      - type: string
        name: author
      - type: datetime
        name: created_at
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: content
        - type: string
          name: author
        output:
          type: Self
    services:
    - name: IssueStatusTransitionService
      description: Validates issue status transitions according to state machine rules
      operations:
      - name: can_transition
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: current_status
        - type: IssueStatus
          name: target_status
        output:
          type: boolean
      - name: validate_transition
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: current_status
        - type: IssueStatus
          name: target_status
        output:
          type: None
    ports:
    - name: IssueRepository
      description: Persistence interface for Issue aggregate
      kind: repository
      aggregate: Issue
      operations:
      - name: save
        inputs:
        - type: Self
          name: self
        - type: Issue
          name: issue
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: IssueId
          name: issue_id
        output:
          type: Issue
          optional: true
      - name: find_all
        inputs:
        - type: Self
          name: self
        - type: integer
          name: limit
        - type: integer
          name: offset
        - type: IssueStatus
          optional: true
          name: status
        - type: IssueType
          optional: true
          name: issue_type
        - type: Severity
          optional: true
          name: severity
        - type: string
          container: list
          optional: true
          name: labels
        output:
          type: Issue
          container: list
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: IssueId
          name: issue_id
        output:
          type: boolean
      - name: find_by_task_id
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: Issue
          container: list
      - name: count
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          optional: true
          name: status
        - type: IssueType
          optional: true
          name: issue_type
        output:
          type: integer
    - name: IssueEventPublisher
      description: Publisher for Issue domain events
      kind: adapter
      operations:
      - name: publish
        inputs:
        - type: Self
          name: self
        - type: DomainEvent
          name: event
        output:
          type: None
      - name: publish_all
        inputs:
        - type: Self
          name: self
        - type: DomainEvent
          container: list
          name: events
        output:
          type: None
  application:
    use_cases:
    - name: LinkIssueToTask
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        name: task_id
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Link an issue to a task from Planning context
      dependencies:
      - type: IssueRepository
        name: issue_repository
      - type: IssueEventPublisher
        name: event_publisher
    - name: CloseIssue
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        optional: true
        name: resolution
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Close an issue that is in RESOLVED status
      dependencies:
      - type: IssueRepository
        name: issue_repository
      - type: IssueEventPublisher
        name: event_publisher
    - name: UpdateIssueStatus
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: IssueStatus
        name: new_status
      - type: string
        name: changed_by
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Update issue status with state machine validation
      dependencies:
      - type: IssueRepository
        name: issue_repository
      - type: IssueEventPublisher
        name: event_publisher
      - type: IssueStatusTransitionService
        name: status_transition_service
    - name: GetIssueDetails
      kind: query
      inputs:
      - type: string
        name: issue_id
      outputs:
      - type: boolean
        name: success
      - type: dict
        optional: true
        name: issue
      - type: string
        optional: true
        name: error
      description: Get full issue details including comments and labels
      dependencies:
      - type: IssueRepository
        name: issue_repository
    - name: CreateIssue
      kind: command
      inputs:
      - type: string
        name: title
      - type: string
        name: description
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: string
        name: submitter_name
      - type: string
        name: submitter_email
      outputs:
      - type: boolean
        name: success
      - type: string
        name: issue_id
      - type: string
        name: error
        default: ''
      description: Create a new issue with initial status NEW
      dependencies:
      - type: IssueRepository
        name: issue_repository
      - type: IssueEventPublisher
        name: event_publisher
    - name: UpdateIssueMetadata
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: IssueType
        optional: true
        name: type
      - type: Severity
        optional: true
        name: severity
      - type: string
        container: list
        optional: true
        name: add_labels
      - type: string
        container: list
        optional: true
        name: remove_labels
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Update issue metadata like type, severity, and labels
      dependencies:
      - type: IssueRepository
        name: issue_repository
      - type: IssueEventPublisher
        name: event_publisher
    - name: ListIssues
      kind: query
      inputs:
      - type: IssueStatus
        optional: true
        name: status
      - type: IssueType
        optional: true
        name: type
      - type: string
        container: list
        optional: true
        name: labels
      - type: integer
        name: limit
        default: 10
      - type: integer
        name: offset
        default: 0
      outputs:
      - type: dict
        container: list
        name: issues
      - type: integer
        name: total_count
      - type: string
        optional: true
        name: error
      description: Paginated list of issues with filtering
      dependencies:
      - type: IssueRepository
        name: issue_repository
    - name: UnlinkIssueFromTask
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        name: task_id
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Unlink an issue from a task
      dependencies:
      - type: IssueRepository
        name: issue_repository
      - type: IssueEventPublisher
        name: event_publisher
    - name: AddComment
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        name: content
      - type: string
        name: author
      outputs:
      - type: boolean
        name: success
      - type: string
        name: comment_id
      - type: string
        name: error
        default: ''
      description: Add a comment to an issue
      dependencies:
      - type: IssueRepository
        name: issue_repository
      - type: IssueEventPublisher
        name: event_publisher
  infrastructure:
    implementations:
    - name: SqlAlchemyIssueRepository
      implements: IssueRepository
      technology: sql
      description: SQLAlchemy implementation of IssueRepository
      attributes:
      - type: Session
        name: session
      private_methods:
      - name: _to_domain
        inputs:
        - type: Self
          name: self
        - type: IssueModel
          name: model
        output:
          type: Issue
      - name: _to_model
        inputs:
        - type: Self
          name: self
        - type: Issue
          name: issue
        - type: Session
          name: session
        output:
          type: IssueModel
    - name: PostgresNotifyEventPublisher
      implements: IssueEventPublisher
      technology: postgres
      description: PostgreSQL NOTIFY implementation of IssueEventPublisher
      attributes:
      - type: Connection
        name: connection
- name: Planning
  domain:
    aggregates:
    - name: Task
      description: The atomic unit of planning, representing a node in the DAG.
      attributes:
      - type: TaskId
        name: id
      - type: string
        name: project_id
      - type: string
        name: name
      - type: string
        name: description
      - type: TaskStatus
        name: status
      - type: CompletionLogic
        name: completion_logic
      - type: StoryPoint
        name: effort
      - type: ValueScore
        name: base_value
      - type: TaskId
        container: set
        name: dependencies
      - type: TaskId
        container: set
        name: dependents
        default: set
      - type: PlanningLevel
        name: planning_level
      - type: RecurrencePolicy
        optional: true
        name: recurrence
      - type: TaskOutput
        optional: true
        name: output
      - type: ReviewFeedback
        optional: true
        name: review_feedback
      behaviors:
      - name: create
        description: Factory method to create a new Task
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: project_id
        - type: string
          name: name
        - type: string
          name: description
        - type: StoryPoint
          name: effort
        - type: ValueScore
          name: base_value
        - type: CompletionLogic
          name: completion_logic
        - type: TaskId
          container: set
          name: dependencies
        - type: Any
          custom_type_string: Union[str, PlanningLevel]
          name: planning_level
        output:
          type: Task
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: task_id
        - type: string
          name: project_id
        - type: string
          name: name
        - type: string
          name: description
        - type: Any
          custom_type_string: Union[TaskStatus, str]
          name: status
        - type: Any
          custom_type_string: Union[StoryPoint, int]
          name: effort
        - type: Any
          custom_type_string: Union[ValueScore, float]
          name: base_value
        - type: Any
          custom_type_string: Union[CompletionLogic, str]
          name: completion_logic
        - type: Any
          custom_type_string: Union[set[str], set[TaskId]]
          name: dependencies
        - type: Any
          custom_type_string: Union[PlanningLevel, str]
          name: planning_level
        - type: TaskOutput
          optional: true
          name: output
        - type: ReviewFeedback
          optional: true
          name: review_feedback
        output:
          type: any
      - name: to_dict
        inputs:
        - type: Self
          name: self
        output:
          type: dict
      - name: to_summary_dict
        description: Returns a simplified dictionary representation for listing.
        inputs:
        - type: Self
          name: self
        output:
          type: dict
      - name: mark_ready
        description: "将任务标记为 READY（依赖已满足，可被领取）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 PENDING 或 BLOCKED"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: mark_pending
        description: "将任务标记为 PENDING（新增了未满足的依赖）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 READY"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: claim
        description: "领取任务开始执行。\n\nRaises:\n    TaskNotClaimableError: 当前状态不是 READY\
          \ 或 CHANGES_REQUESTED"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: set_output
        description: "设置任务执行结果。\n\nRaises:\n    IllegalStateTransitionError: 当前状态不是\
          \ IN_PROGRESS"
        inputs:
        - type: Self
          name: self
        - type: TaskOutput
          name: output
        output:
          type: None
      - name: mark_completed
        description: "直接标记任务完成（用于手动/自动完成场景）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不允许直接完成"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: review
        description: "验证任务并记录反馈。\n\nArgs:\n    approved: 是否通过\n    feedback: 详细评价意见\n\
          Raises:\n    IllegalStateTransitionError: 如果当前状态不是 REVIEW"
        inputs:
        - type: Self
          name: self
        - type: boolean
          name: approved
        - type: string
          name: feedback
        output:
          type: None
      - name: is_done
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: is_claimable
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    enums:
    - name: CompletionLogic
      description: Rules defining how a task is unlocked based on its dependencies.
      members:
      - name: ALL
        value: all
      - name: ANY
        value: any
    - name: TaskStatus
      description: The lifecycle state of a task.
      members:
      - name: PENDING
        value: pending
      - name: BLOCKED
        value: blocked
      - name: READY
        value: ready
      - name: IN_PROGRESS
        value: in_progress
      - name: REVIEW
        value: review
      - name: DONE
        value: done
      - name: CHANGES_REQUESTED
        value: changes_requested
      - name: SKIPPED
        value: skipped
      - name: DISCARDED
        value: discarded
    - name: PlanningLevel
      description: Defines the uncertainty and granularity of the task.
      members:
      - name: INITIATIVE
        value: initiative
      - name: MILESTONE
        value: milestone
      - name: ARCHITECTURAL
        value: architectural
      - name: FEATURE
        value: feature
      - name: ATOMIC
        value: atomic
    - name: RecurrenceType
      members:
      - name: ON_SUCCESS
        value: on_success
      - name: CRON
        value: cron
      - name: ON_FAILURE
        value: on_failure
    value_objects:
    - name: ValueScore
      description: Numeric representation of business value.
      attributes:
      - type: float
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: float
          name: value
        output:
          type: ValueScore
      - name: __add__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: __radd__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: float
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: TaskOutput
      description: 任务执行者的交付物
      attributes:
      - type: string
        name: summary
      - type: string
        container: list
        name: artifacts
      - type: string
        optional: true
        name: error
    - name: RecurrencePolicy
      description: Rules for creating a successor task upon completion.
      attributes:
      - type: RecurrenceType
        name: type
      - type: integer
        name: max_repetitions
        default: int
      - type: integer
        name: current_iteration
      behaviors:
      - name: next_iteration
        inputs:
        - type: Self
          name: self
        output:
          type: RecurrencePolicy
    - name: StoryPoint
      description: Encapsulated Fibonacci number representing effort (1, 2, 3, 5,
        8, 13...).
      attributes:
      - type: integer
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: integer
          name: effort
        output:
          type: StoryPoint
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: integer
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
      - name: validate_fibonacci
        inputs:
        - type: Self
          container: type
          name: cls
        - type: integer
          name: v
        output:
          type: integer
      - name: __add__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: __radd__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: __lt__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
    - name: ReviewFeedback
      description: 任务规划者的验收意见
      attributes:
      - type: string
        name: comment
      - type: string
        name: decision
    - name: TaskId
      description: Unique identifier for a Task.
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    services:
    - name: DependencyResolutionService
      operations:
      - name: evaluate_blocking_status
        description: "Evaluates whether a task is blocked based on its dependencies\
          \ and completion logic.\n\nReturns:\n    True if blocked (dependencies not\
          \ satisfied).\n    False if unblocked (ready to proceed)."
        inputs:
        - type: Self
          name: self
        - type: Task
          name: task
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: CycleDetectionService
      description: Ensures the planning graph remains a DAG.
      operations:
      - name: detect_cycle
        description: "Detects if adding a dependency (target -> new_dependency) would\
          \ create a cycle.\n\nLogic:\n    If we are adding a dependency where 'target'\
          \ depends on 'new_dependency',\n    a cycle exists if 'target' is already\
          \ an ancestor of 'new_dependency'.\n    We traverse up from 'new_dependency'\
          \ to see if we can reach 'target'."
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: target_task_id
        - type: TaskId
          name: new_dependency_id
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: PriorityAnalysisService
      description: Calculates dynamic priority (ROI) for all tasks.
      operations:
      - name: calculate_priorities
        description: "Orchestrates the calculation of Dynamic Priority for all active\
          \ tasks.\n\nAlgorithm:\n1. Load Graph: Fetch all active tasks.\n2. Forward\
          \ Propagation: Calculate Effective Effort (Cost to implement).\n   - For\
          \ OR nodes, takes the path of least resistance (Min).\n3. Backward Propagation:\
          \ Calculate Accumulated Value (Business Value).\n   - Value flows from Dependents\
          \ back to Dependencies.\n4. Score: ROI = Accumulated Value / Effective Effort."
        inputs:
        - type: Self
          name: self
        - type: TaskRepository
          name: repository
        - type: string
          optional: true
          name: project_id
        output:
          type: Task
          container: list
    ports:
    - name: TaskRepository
      description: Persistence interface for Tasks.
      kind: repository
      aggregate: Task
      operations:
      - name: save
        inputs:
        - type: Self
          name: self
        - type: Task
          name: task
        output:
          type: None
      - name: get
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: Task
          optional: true
      - name: find_all_active
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: project_id
        output:
          type: Task
          container: list
      - name: find_all
        inputs:
        - type: Self
          name: self
        output:
          type: Task
          container: list
      - name: find_dependents
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: Task
          container: list
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: Task
          optional: true
      - name: find_by_ids
        inputs:
        - type: Self
          name: self
        - type: TaskId
          container: set
          name: task_ids
        output:
          type: Task
          container: list
      - name: find_paged
        inputs:
        - type: Self
          name: self
        - type: integer
          name: page
        - type: integer
          name: page_size
        - type: TaskStatus
          optional: true
          name: status
        - type: string
          optional: true
          name: project_id
        - type: PlanningLevel
          optional: true
          name: planning_level
        - type: string
          optional: true
          name: search
        output:
          type: Any
          custom_type_string: tuple[list[Task], int]
