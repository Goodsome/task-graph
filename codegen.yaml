# yaml-language-server: $schema=./codegen.schema.json
name: TaskGraph
description: ''
contexts:
- name: Planning
  domain:
    aggregates:
    - name: Task
      description: The atomic unit of planning, representing a node in the DAG.
      attributes:
      - type: TaskId
        name: id
      - type: string
        name: project_id
      - type: string
        name: name
      - type: string
        name: description
      - type: TaskStatus
        name: status
      - type: CompletionLogic
        name: completion_logic
      - type: StoryPoint
        name: effort
      - type: ValueScore
        name: base_value
      - type: TaskId
        container: set
        name: dependencies
      - type: TaskId
        container: set
        optional: true
        name: dependents
      - type: PlanningLevel
        name: planning_level
      - type: RecurrencePolicy
        optional: true
        name: recurrence
      - type: TaskOutput
        optional: true
        name: output
      - type: ReviewFeedback
        optional: true
        name: review_feedback
      behaviors:
      - name: create
        inputs:
        - type: string
          name: project_id
        - type: string
          name: name
        - type: string
          name: description
        - type: StoryPoint
          name: effort
        - type: ValueScore
          name: base_value
        - type: CompletionLogic
          name: completion_logic
        - type: TaskId
          container: set
          name: dependencies
        - type: Any
          custom_type_string: Union[str, PlanningLevel]
          name: planning_level
        output:
          type: Task
      - name: reconstitute
        inputs:
        - type: string
          name: task_id
        - type: string
          name: project_id
        - type: string
          name: name
        - type: string
          name: description
        - type: Any
          custom_type_string: Union[TaskStatus, str]
          name: status
        - type: Any
          custom_type_string: Union[StoryPoint, int]
          name: effort
        - type: Any
          custom_type_string: Union[ValueScore, float]
          name: base_value
        - type: Any
          custom_type_string: Union[CompletionLogic, str]
          name: completion_logic
        - type: Any
          custom_type_string: Union[set[str], set[TaskId]]
          name: dependencies
        - type: Any
          custom_type_string: Union[PlanningLevel, str]
          name: planning_level
        - type: TaskOutput
          optional: true
          name: output
          default: None
        - type: ReviewFeedback
          optional: true
          name: review_feedback
          default: None
        output:
          type: any
      - name: to_dict
        output:
          type: dict
      - name: to_summary_dict
        output:
          type: dict
      - name: mark_ready
        output:
          type: None
      - name: mark_pending
        output:
          type: None
      - name: claim
        output:
          type: None
      - name: set_output
        inputs:
        - type: TaskOutput
          name: output
        output:
          type: None
      - name: mark_completed
        output:
          type: None
      - name: review
        inputs:
        - type: boolean
          name: approved
        - type: string
          name: feedback
        output:
          type: None
      - name: is_done
        output:
          type: boolean
      - name: is_claimable
        output:
          type: boolean
    enums:
    - name: CompletionLogic
      description: Rules defining how a task is unlocked based on its dependencies.
      members:
      - name: ALL
        value: all
      - name: ANY
        value: any
    - name: TaskStatus
      description: The lifecycle state of a task.
      members:
      - name: PENDING
        value: pending
      - name: BLOCKED
        value: blocked
      - name: READY
        value: ready
      - name: IN_PROGRESS
        value: in_progress
      - name: REVIEW
        value: review
      - name: DONE
        value: done
      - name: CHANGES_REQUESTED
        value: changes_requested
      - name: SKIPPED
        value: skipped
      - name: DISCARDED
        value: discarded
    - name: PlanningLevel
      description: Defines the uncertainty and granularity of the task.
      members:
      - name: INITIATIVE
        value: initiative
      - name: MILESTONE
        value: milestone
      - name: ARCHITECTURAL
        value: architectural
      - name: FEATURE
        value: feature
      - name: ATOMIC
        value: atomic
    - name: RecurrenceType
      members:
      - name: ON_SUCCESS
        value: on_success
      - name: CRON
        value: cron
      - name: ON_FAILURE
        value: on_failure
    value_objects:
    - name: ValueScore
      description: Numeric representation of business value.
      attributes:
      - type: float
        name: value
        default: Field(..., gt=0)
      behaviors:
      - name: create
        inputs:
        - type: float
          name: value
        output:
          type: ValueScore
      - name: __add__
        inputs:
        - type: any
          name: other
        output:
          type: any
      - name: __radd__
        inputs:
        - type: any
          name: other
        output:
          type: any
      - name: serialize
        output:
          type: float
      - name: validate_from_primitive
        inputs:
        - type: any
          name: data
        output:
          type: any
    - name: TaskOutput
      description: 任务执行者的交付物
      attributes:
      - type: string
        name: summary
      - type: string
        container: list
        name: artifacts
      - type: string
        optional: true
        name: error
    - name: RecurrencePolicy
      description: Rules for creating a successor task upon completion.
      attributes:
      - type: RecurrenceType
        name: type
      - type: integer
        optional: true
        name: max_repetitions
      - type: integer
        name: current_iteration
      behaviors:
      - name: next_iteration
        output:
          type: RecurrencePolicy
    - name: StoryPoint
      description: Encapsulated Fibonacci number representing effort (1, 2, 3, 5,
        8, 13...).
      attributes:
      - type: integer
        name: value
        default: Field(..., gt=0, description='Effort points must be positive')
      behaviors:
      - name: create
        inputs:
        - type: integer
          name: effort
        output:
          type: StoryPoint
      - name: serialize
        output:
          type: integer
      - name: validate_from_primitive
        inputs:
        - type: any
          name: data
        output:
          type: any
      - name: validate_fibonacci
        inputs:
        - type: integer
          name: v
        output:
          type: integer
      - name: __add__
        inputs:
        - type: any
          name: other
        output:
          type: any
      - name: __radd__
        inputs:
        - type: any
          name: other
        output:
          type: any
      - name: __lt__
        inputs:
        - type: any
          name: other
        output:
          type: any
    - name: ReviewFeedback
      description: 任务规划者的验收意见
      attributes:
      - type: string
        name: comment
      - type: string
        name: decision
    - name: TaskId
      description: Unique identifier for a Task.
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        output:
          type: any
      - name: serialize
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: any
          name: data
        output:
          type: any
    services:
    - name: DependencyResolutionService
      operations:
      - name: evaluate_blocking_status
        inputs:
        - type: Task
          name: task
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: CycleDetectionService
      description: Ensures the planning graph remains a DAG.
      operations:
      - name: detect_cycle
        inputs:
        - type: TaskId
          name: target_task_id
        - type: TaskId
          name: new_dependency_id
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: PriorityAnalysisService
      description: Calculates dynamic priority (ROI) for all tasks.
      operations:
      - name: calculate_priorities
        inputs:
        - type: TaskRepository
          name: repository
        - type: string
          optional: true
          name: project_id
          default: None
        output:
          type: Task
          container: list
    ports:
    - name: TaskRepository
      description: Persistence interface for Tasks.
      kind: repository
      aggregate: Task
      operations:
      - name: save
        inputs:
        - type: Task
          name: task
        output:
          type: None
      - name: get
        inputs:
        - type: TaskId
          name: task_id
        output:
          type: Task
          optional: true
      - name: find_all_active
        inputs:
        - type: string
          optional: true
          name: project_id
          default: None
        output:
          type: Task
          container: list
      - name: find_all
        output:
          type: Task
          container: list
      - name: find_dependents
        inputs:
        - type: TaskId
          name: task_id
        output:
          type: Task
          container: list
      - name: delete
        inputs:
        - type: TaskId
          name: task_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: TaskId
          name: task_id
        output:
          type: Task
          optional: true
      - name: find_by_ids
        inputs:
        - type: TaskId
          container: set
          name: task_ids
        output:
          type: Task
          container: list
      - name: find_paged
        inputs:
        - type: TaskStatus
          optional: true
          name: status
        - type: string
          optional: true
          name: project_id
        - type: PlanningLevel
          optional: true
          name: planning_level
        - type: string
          optional: true
          name: search
        - type: integer
          name: page
        - type: integer
          name: page_size
        output:
          type: Any
          custom_type_string: tuple[list[Task], int]
  application:
    use_cases:
    - name: SubmitTaskResult
      kind: command
      command:
        attributes:
        - type: string
          name: task_id
        - type: string
          name: summary
        - type: string
          container: list
          optional: true
          name: artifacts
        - type: string
          optional: true
          name: error
          default: None
      result:
        attributes:
        - type: UnitOfWork
          name: uow
    - name: CreateTask
      kind: command
      dependencies:
      - type: UnitOfWork
        name: uow
      command:
        attributes:
        - type: string
          name: project_id
        - type: string
          name: name
        - type: string
          name: description
        - type: integer
          name: effort
        - type: float
          name: base_value
        - type: PlanningLevel
          name: planning_level
        - type: CompletionLogic
          name: completion_logic
          default: CompletionLogic.ALL
        - type: string
          container: list
          optional: true
          name: dependencies
      result:
        attributes:
        - type: boolean
          name: success
        - type: string
          name: task_id
        - type: string
          name: error
    - name: UpdateTaskStatus
      kind: command
      dependencies:
      - type: UnitOfWork
        name: uow
      - type: DependencyResolutionService
        name: resolution_service
      command:
        attributes:
        - type: string
          name: task_id
        - type: string
          name: new_status
      result:
        attributes:
        - type: boolean
          name: success
        - type: string
          container: list
          name: affected_tasks
        - type: string
          name: error
          default: ''''''
    - name: SuggestNextAction
      kind: query
      dependencies:
      - type: UnitOfWork
        name: uow
      - type: PriorityAnalysisService
        name: priority_service
      query:
        attributes:
        - type: integer
          name: top_n
        - type: string
          optional: true
          name: project_id
          default: None
      result:
        attributes:
        - type: Task
          container: list
          name: tasks
    - name: GetTaskDetails
      kind: query
      dependencies:
      - type: UnitOfWork
        name: uow
      query:
        attributes:
        - type: string
          name: task_id
          default: Field(..., description='The ID of the task to retrieve details
            for')
      result:
        attributes:
        - type: boolean
          name: success
        - type: any
          container: map
          optional: true
          name: task
          default: None
        - type: string
          optional: true
          name: error
          default: None
    - name: ReviewTask
      kind: command
      dependencies:
      - type: UnitOfWork
        name: uow
      - type: DependencyResolutionService
        name: resolution_service
      command:
        attributes:
        - type: string
          name: task_id
        - type: boolean
          name: approved
        - type: string
          name: feedback
      result:
        attributes:
        - type: boolean
          name: success
        - type: string
          name: task_id
        - type: string
          container: list
          optional: true
          name: affected_tasks
        - type: string
          name: error
          default: ''''''
    - name: DeleteTask
      kind: command
      dependencies:
      - type: UnitOfWork
        name: uow
      command:
        attributes:
        - type: string
          name: task_id
      result:
        attributes:
        - type: boolean
          name: success
        - type: string
          optional: true
          name: error
          default: ''''''
    - name: ModifyTaskDependencies
      kind: command
      dependencies:
      - type: UnitOfWork
        name: uow
      - type: CycleDetectionService
        name: cycle_detector
      - type: DependencyResolutionService
        name: dependency_resolver
      command:
        attributes:
        - type: string
          name: task_id
        - type: string
          container: list
          optional: true
          name: added_dependencies
        - type: string
          container: list
          optional: true
          name: removed_dependencies
      result:
        attributes:
        - type: boolean
          name: success
        - type: string
          optional: true
          name: error
    - name: ReviseTaskDetails
      kind: command
      dependencies:
      - type: UnitOfWork
        name: uow
      command:
        attributes:
        - type: string
          name: task_id
        - type: string
          optional: true
          name: name
          default: None
        - type: string
          optional: true
          name: description
          default: None
        - type: integer
          optional: true
          name: effort
          default: None
        - type: float
          optional: true
          name: base_value
          default: None
      result:
        attributes:
        - type: boolean
          name: success
        - type: string
          name: error
          default: ''''''
    - name: ClaimTask
      kind: command
      dependencies:
      - type: UnitOfWork
        name: uow
      - type: DependencyResolutionService
        name: dependency_service
      command:
        attributes:
        - type: string
          name: task_id
        - type: string
          optional: true
          name: executor_id
      result:
        attributes:
        - type: boolean
          name: success
        - type: string
          name: task_id
        - type: string
          optional: true
          name: error
        - type: string
          optional: true
          name: error_code
    - name: ListTasks
      kind: query
      dependencies:
      - type: UnitOfWork
        name: uow
      query:
        attributes:
        - type: string
          optional: true
          name: project_id
          default: None
        - type: integer
          name: page
          default: '1'
        - type: integer
          name: page_size
          default: '10'
        - type: TaskStatus
          optional: true
          name: status
          default: None
        - type: PlanningLevel
          optional: true
          name: planning_level
          default: None
        - type: string
          optional: true
          name: search
          default: ''''''
      result:
        attributes:
        - type: dict
          container: list
          name: tasks
        - type: integer
          name: total_count
        - type: integer
          name: total_pages
        - type: integer
          name: current_page
        - type: string
          optional: true
          name: error
          default: None
  infrastructure:
    implementations:
    - name: SqlAlchemyTaskRepository
      implements: TaskRepository
      technology: sql
      description: SQLAlchemy implementation of TaskRepository.
      attributes:
      - type: Session
        name: session
      private_methods:
      - name: _to_domain
        inputs:
        - type: TaskModel
          name: model
        output:
          type: Task
      - name: _to_model
        inputs:
        - type: Task
          name: task
        - type: Session
          name: session
        output:
          type: TaskModel
- name: Shared
