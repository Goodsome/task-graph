    services:
    - name: DependencyResolutionService
      operations:
      - description: "Evaluates whether a task is blocked based on its dependencies\
          \ and completion logic.\n\nReturns:\n    True if blocked (dependencies not\
          \ satisfied).\n    False if unblocked (ready to proceed)."
        inputs:
        - name: self
          type: Self
        - name: task
          type: Task
        - name: repository
          type: TaskRepository
        name: evaluate_blocking_status
        output:
          type: boolean
    - description: Ensures the planning graph remains a DAG.
      name: CycleDetectionService
      operations:
      - description: "Detects if adding a dependency (target -> new_dependency) would\
          \ create a cycle.\n\nLogic:\n    If we are adding a dependency where 'target'\
          \ depends on 'new_dependency',\n    a cycle exists if 'target' is already\
          \ an ancestor of 'new_dependency'.\n    We traverse up from 'new_dependency'\
          \ to see if we can reach 'target'."
        inputs:
        - name: self
          type: Self
        - name: target_task_id
          type: TaskId
        - name: new_dependency_id
          type: TaskId
        - name: repository
          type: TaskRepository
        name: detect_cycle
        output:
          type: boolean
    - description: Calculates dynamic priority (ROI) for all tasks.
      name: PriorityAnalysisService
      operations:
      - description: "Orchestrates the calculation of Dynamic Priority for all active\
          \ tasks.\n\nAlgorithm:\n1. Load Graph: Fetch all active tasks.\n2. Forward\
          \ Propagation: Calculate Effective Effort (Cost to implement).\n   - For\
          \ OR nodes, takes the path of least resistance (Min).\n3. Backward Propagation:\
          \ Calculate Accumulated Value (Business Value).\n   - Value flows from Dependents\
          \ back to Dependencies.\n4. Score: ROI = Accumulated Value / Effective Effort."
        inputs:
        - name: self
          type: Self
        - name: repository
          type: TaskRepository
        - name: project_id
          optional: true
          type: string
        name: calculate_priorities
        output:
          container: list
          type: Task
