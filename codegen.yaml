# yaml-language-server: $schema=./codegen.schema.json
name: TaskGraph
contexts:
- name: Bootstrap
- name: IssueTracking
  domain:
    aggregates:
    - name: Issue
      description: Issue aggregate root managing the complete issue lifecycle
      attributes:
      - type: IssueId
        name: id
      - type: string
        name: project_id
      - type: IssueTitle
        name: title
      - type: IssueDescription
        name: description
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: IssueStatus
        name: status
      - type: Submitter
        name: submitter
      - type: Label
        container: list
        name: labels
      - type: Comment
        container: list
        name: comments
      - type: TaskLink
        container: list
        name: task_links
      - type: datetime
        name: created_at
      - type: datetime
        name: updated_at
      behaviors:
      - name: create
        description: Create a new Issue aggregate
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: project_id
        - type: string
          name: title
        - type: string
          name: description
        - type: IssueType
          name: issue_type
        - type: Severity
          name: severity
        - type: Submitter
          name: submitter
        output:
          type: Self
      - name: change_status
        description: Change issue status with audit trail
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: new_status
        - type: string
          name: changed_by
        output:
          type: None
      - name: close
        description: Close the issue with optional resolution note
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: resolution
        output:
          type: None
      - name: add_comment
        description: Add a comment to the issue
        inputs:
        - type: Self
          name: self
        - type: string
          name: content
        - type: string
          name: author
        output:
          type: None
      - name: add_label
        description: Add a label to the issue (duplicates ignored)
        inputs:
        - type: Self
          name: self
        - type: Label
          name: label
        output:
          type: None
      - name: remove_label
        description: Remove a label from the issue by name
        inputs:
        - type: Self
          name: self
        - type: string
          name: label_name
        output:
          type: None
      - name: link_to_task
        description: Link this issue to a planning task
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: TaskLink
      - name: unlink_from_task
        description: Remove link to a planning task
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: None
      - name: update_metadata
        description: Update issue type and/or severity
        inputs:
        - type: Self
          name: self
        - type: IssueType
          optional: true
          name: issue_type
        - type: Severity
          optional: true
          name: severity
        output:
          type: None
    enums:
    - name: IssueType
      description: Classification of issue types
      members:
      - name: BUG
        value: bug
      - name: FEATURE
        value: feature
      - name: QUESTION
        value: question
      - name: IMPROVEMENT
        value: improvement
    - name: Severity
      description: Severity level of an issue
      members:
      - name: CRITICAL
        value: critical
      - name: MAJOR
        value: major
      - name: MINOR
        value: minor
      - name: LOW
        value: low
    - name: IssueStatus
      description: Lifecycle state of an issue
      members:
      - name: REPORTED
        value: reported
      - name: TRIAGED
        value: triaged
      - name: IN_PROGRESS
        value: in_progress
      - name: RESOLVED
        value: resolved
      - name: CLOSED
        value: closed
    value_objects:
    - name: IssueTitle
      description: Title of an issue, max 200 characters
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: Create a new IssueTitle instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: IssueTitle
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: CommentId
      description: Unique identifier for a Comment
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: Self
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: Self
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: IssueDescription
      description: Description of an issue, max 10000 characters
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: Create a new IssueDescription instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: IssueDescription
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: Label
      description: Label for categorizing issues
      attributes:
      - type: string
        name: name
      behaviors:
      - name: create
        description: Create a new Label instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        output:
          type: Label
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: IssueId
      description: Unique identifier for an Issue
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        description: Create a new IssueId with a random UUID
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: IssueId
      - name: reconstitute
        description: Reconstruct an IssueId from a UUID or string
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: IssueId
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: TaskLink
      description: Link between an Issue and a Task from Planning context
      attributes:
      - type: TaskId
        name: task_id
      - type: datetime
        name: linked_at
      behaviors:
      - name: create
        description: Create a new TaskLink instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[TaskId, str]
          name: task_id
        output:
          type: TaskLink
      - name: validate_from_orm
        description: Support converting ORM models to TaskLink
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[dict, object]
          name: data
        output:
          type: dict
    - name: Submitter
      description: Information about the issue submitter
      attributes:
      - type: string
        name: name
      behaviors:
      - name: create
        description: Create a new Submitter instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        output:
          type: Self
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    entities:
    - name: Comment
      description: Comment attached to an Issue, immutable after creation
      attributes:
      - type: CommentId
        name: id
      - type: string
        name: content
      - type: string
        name: author
      - type: datetime
        name: created_at
      behaviors:
      - name: create
        description: Create a new Comment instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: content
        - type: string
          name: author
        output:
          type: Self
      - name: validate_primitive_types
        description: Convert primitive types to proper value objects when reconstructing
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[dict, object]
          name: data
        output:
          type: dict
    services:
    - name: IssueStatusTransitionService
      description: Validates issue status transitions according to state machine rules
      operations:
      - name: can_transition
        description: Check if transition from current_status to target_status is allowed
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: current_status
        - type: IssueStatus
          name: target_status
        output:
          type: boolean
      - name: validate_transition
        description: Validate transition, raise ValueError if invalid
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: current_status
        - type: IssueStatus
          name: target_status
        output:
          type: None
    ports:
    - name: IssueRepository
      description: Persistence interface for Issue aggregate
      kind: repository
      aggregate: Issue
      operations:
      - name: save
        inputs:
        - type: Self
          name: self
        - type: Issue
          name: issue
        output:
          type: None
        rules:
        - name: save_new_issue
          given: 传入一个未持久化的Issue聚合根实例
          when: 调用save方法
          then: Issue实例被持久化到数据库，没有返回值
        - name: update_existing_issue
          given: 传入一个已在数据库中存在的Issue聚合根实例
          when: 调用save方法
          then: 数据库中对应的Issue记录被更新，没有返回值
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: IssueId
          name: issue_id
        output:
          type: Issue
          optional: true
        rules:
        - name: find_existing_issue_by_id
          given: 传入的issue_id对应的Issue在数据库中存在
          when: 调用find_by_id方法
          then: 返回对应的Issue聚合根实例
        - name: find_non_existent_issue_by_id
          given: 传入的issue_id对应的Issue在数据库中不存在
          when: 调用find_by_id方法
          then: 返回None
      - name: find_all
        inputs:
        - type: Self
          name: self
        - type: integer
          name: limit
        - type: integer
          name: offset
        - type: IssueStatus
          optional: true
          name: status
        - type: IssueType
          optional: true
          name: issue_type
        - type: Severity
          optional: true
          name: severity
        - type: string
          container: list
          optional: true
          name: labels
        - type: string
          optional: true
          name: project_id
        output:
          type: Issue
          container: list
        rules:
        - name: find_all_issues_with_pagination
          given: 传入limit和offset参数，其他过滤参数为空
          when: 调用find_all方法
          then: 返回按分页参数查询到的Issue列表，不应用任何过滤条件
        - name: find_issues_filtered_by_status
          given: 传入status过滤参数
          when: 调用find_all方法
          then: 返回符合指定状态的Issue列表
        - name: find_issues_with_multiple_filters
          given: 传入多个过滤参数（如status、issue_type、severity、labels）
          when: 调用find_all方法
          then: 返回同时满足所有过滤条件的Issue列表
        - name: find_issues_no_matches
          given: 过滤条件没有匹配的Issue
          when: 调用find_all方法
          then: 返回空列表
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: IssueId
          name: issue_id
        output:
          type: boolean
        rules:
        - name: delete_existing_issue
          given: 传入的issue_id对应的Issue在数据库中存在
          when: 调用delete方法
          then: Issue被从数据库中删除，返回True
        - name: delete_non_existent_issue
          given: 传入的issue_id对应的Issue在数据库中不存在
          when: 调用delete方法
          then: 数据库没有变化，返回False
      - name: find_by_task_id
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: Issue
          container: list
        rules:
        - name: find_issues_linked_to_task
          given: 传入有效的task_id
          when: 调用find_by_task_id方法
          then: 返回所有与该task_id关联的Issue列表
        - name: find_issues_no_linked_to_task
          given: 传入的task_id没有关联任何Issue
          when: 调用find_by_task_id方法
          then: 返回空列表
      - name: count
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          optional: true
          name: status
        - type: IssueType
          optional: true
          name: issue_type
        output:
          type: integer
        rules:
        - name: count_all_issues
          given: 不传入任何过滤参数
          when: 调用count方法
          then: 返回数据库中所有Issue的总数量
        - name: count_issues_with_filters
          given: 传入status或issue_type过滤参数
          when: 调用count方法
          then: 返回符合过滤条件的Issue数量
  application:
    use_cases:
    - name: LinkIssueToTask
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        name: task_id
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Link an issue to a task from Planning context
      dependencies:
      - type: UnitOfWork
        name: uow
    - name: CloseIssue
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        optional: true
        name: resolution
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Close an issue that is in RESOLVED status
      dependencies:
      - type: UnitOfWork
        name: uow
    - name: UpdateIssueStatus
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: IssueStatus
        name: new_status
      - type: string
        name: changed_by
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Update issue status with state machine validation
      dependencies:
      - type: UnitOfWork
        name: uow
      - type: IssueStatusTransitionService
        name: status_transition_service
    - name: GetIssueDetails
      kind: query
      inputs:
      - type: string
        name: issue_id
      outputs:
      - type: boolean
        name: success
      - type: IssueDetailsDTO
        optional: true
        name: issue
      - type: string
        name: error
        default: ''
      description: Get full issue details including comments and labels
      dependencies:
      - type: UnitOfWork
        name: uow
    - name: CreateIssue
      kind: command
      inputs:
      - type: string
        name: project_id
      - type: string
        name: title
      - type: string
        name: description
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: string
        name: submitter_name
      outputs:
      - type: boolean
        name: success
      - type: string
        name: issue_id
      - type: string
        name: error
        default: ''
      description: Create a new issue with initial status NEW
      dependencies:
      - type: UnitOfWork
        name: uow
    - name: UpdateIssueMetadata
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: IssueType
        optional: true
        name: type
      - type: Severity
        optional: true
        name: severity
      - type: string
        container: list
        optional: true
        name: add_labels
      - type: string
        container: list
        optional: true
        name: remove_labels
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Update issue metadata like type, severity, and labels
      dependencies:
      - type: UnitOfWork
        name: uow
    - name: ListIssues
      kind: query
      inputs:
      - type: IssueStatus
        optional: true
        name: status
      - type: IssueType
        optional: true
        name: type
      - type: Severity
        optional: true
        name: severity
      - type: string
        container: list
        optional: true
        name: labels
      - type: string
        optional: true
        name: project_id
      - type: integer
        name: limit
        default: 10
      - type: integer
        name: offset
        default: 0
      outputs:
      - type: IssueSummaryDTO
        container: list
        name: issues
      - type: integer
        name: total_count
      - type: string
        name: error
        default: ''
      description: Paginated list of issues with filtering
      dependencies:
      - type: UnitOfWork
        name: uow
    - name: UnlinkIssueFromTask
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        name: task_id
      outputs:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
      description: Unlink an issue from a task
      dependencies:
      - type: UnitOfWork
        name: uow
    - name: AddComment
      kind: command
      inputs:
      - type: string
        name: issue_id
      - type: string
        name: content
      - type: string
        name: author
      outputs:
      - type: boolean
        name: success
      - type: string
        name: comment_id
      - type: string
        name: error
        default: ''
      description: Add a comment to an issue
      dependencies:
      - type: UnitOfWork
        name: uow
    ports:
    - name: UnitOfWork
      kind: adapter
      operations:
      - name: issues
        inputs:
        - type: Self
          name: self
        output:
          type: IssueRepository
      - name: event_bus
        inputs:
        - type: Self
          name: self
        output:
          type: EventBus
      - name: __enter__
        inputs:
        - type: Self
          name: self
        output:
          type: UnitOfWork
      - name: __exit__
        inputs:
        - type: Self
          name: self
        - type: BaseException
          container: type
          optional: true
          name: exc_type
        - type: BaseException
          optional: true
          name: exc_val
        - type: TracebackType
          optional: true
          name: exc_tb
        output:
          type: None
      - name: commit
        inputs:
        - type: Self
          name: self
        output:
          type: any
      - name: rollback
        inputs:
        - type: Self
          name: self
        output:
          type: any
  infrastructure:
    implementations:
    - name: SqlAlchemyIssueRepository
      implements: IssueRepository
      technology: sql
      description: SQLAlchemy implementation of IssueRepository
      attributes:
      - type: Session
        name: session
      private_methods:
      - name: _to_domain
        description: Convert ORM model to domain aggregate
        inputs:
        - type: Self
          name: self
        - type: IssueModel
          name: model
        output:
          type: Issue
      - name: _to_model
        description: Convert domain aggregate to ORM model
        inputs:
        - type: Self
          name: self
        - type: Issue
          name: issue
        output:
          type: IssueModel
    - name: SqlAlchemyUnitOfWork
      implements: UnitOfWork
      technology: sql
      attributes:
      - type: Any
        custom_type_string: sessionmaker[Session]
        name: session_factory
      - type: string
        name: event_bus_channel
      - type: IssueRepository
        container: callable
        name: issue_repository_factory
      - type: EventBus
        container: callable
        name: event_bus_factory
      - type: Session
        optional: true
        name: session
      - type: IssueRepository
        optional: true
        name: _issues
      - type: EventBus
        optional: true
        name: _event_bus
  interfaces:
    mcp_tools:
    - name: link_issue_to_task
      use_case: LinkIssueToTask
    - name: close_issue
      use_case: CloseIssue
    - name: update_issue_status
      use_case: UpdateIssueStatus
    - name: get_issue_details
      use_case: GetIssueDetails
    - name: create_issue
      use_case: CreateIssue
    - name: update_issue_metadata
      use_case: UpdateIssueMetadata
    - name: list_issues
      use_case: ListIssues
    - name: unlink_issue_from_task
      use_case: UnlinkIssueFromTask
    - name: add_comment
      use_case: AddComment
- name: Planning
  domain:
    aggregates:
    - name: Task
      description: The atomic unit of planning, representing a node in the DAG.
      attributes:
      - type: TaskId
        name: id
      - type: string
        name: project_id
      - type: string
        name: name
      - type: string
        name: description
      - type: TaskStatus
        name: status
      - type: CompletionLogic
        name: completion_logic
      - type: StoryPoint
        name: effort
      - type: ValueScore
        name: base_value
      - type: TaskId
        container: set
        name: dependencies
      - type: ScopeLevel
        name: scope_level
      - type: ScopeContext
        optional: true
        name: scope_context
      - type: TaskId
        optional: true
        name: parent_id
      - type: RecurrencePolicy
        optional: true
        name: recurrence
      - type: TaskOutput
        optional: true
        name: output
      - type: ReviewFeedback
        optional: true
        name: review_feedback
      behaviors:
      - name: validate_dependencies
        description: 'Convert dependencies from various formats to TaskId set.


          Supports:

          - Set of TaskId objects

          - Set of str/UUID

          - Set of ORM objects with ''id'' attribute'
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: value
        output:
          type: TaskId
          container: set
      - name: create
        description: Factory method to create a new Task
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: project_id
        - type: string
          name: name
        - type: string
          name: description
        - type: StoryPoint
          name: effort
        - type: ValueScore
          name: base_value
        - type: CompletionLogic
          name: completion_logic
        - type: TaskId
          container: set
          name: dependencies
        - type: ScopeLevel
          name: scope_level
        - type: TaskId
          optional: true
          name: parent_id
        - type: ScopeContext
          optional: true
          name: scope_context
        output:
          type: Self
      - name: mark_ready
        description: "将任务标记为 READY（依赖已满足，可被领取）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 PENDING 或 BLOCKED"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: mark_pending
        description: "将任务标记为 PENDING（新增了未满足的依赖）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 READY"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: claim
        description: "领取任务开始执行。\n\nRaises:\n    TaskNotClaimableError: 当前状态不是 READY\
          \ 或 CHANGES_REQUESTED"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: set_output
        description: "设置任务执行结果。\n\nRaises:\n    IllegalStateTransitionError: 当前状态不是\
          \ IN_PROGRESS"
        inputs:
        - type: Self
          name: self
        - type: TaskOutput
          name: output
        output:
          type: None
      - name: mark_completed
        description: "直接标记任务完成（用于手动/自动完成场景）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不允许直接完成"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: review
        description: "验证任务并记录反馈。\n\nArgs:\n    approved: 是否通过\n    feedback: 详细评价意见\n\
          Raises:\n    IllegalStateTransitionError: 如果当前状态不是 REVIEW"
        inputs:
        - type: Self
          name: self
        - type: boolean
          name: approved
        - type: string
          name: feedback
        output:
          type: None
      - name: is_done
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: is_claimable
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    enums:
    - name: ValidatedEnum
      description: Base class for enums that can be validated from strings via Pydantic.
      members: []
    - name: CompletionLogic
      description: Rules defining how a task is unlocked based on its dependencies.
      members:
      - name: ALL
        value: all
      - name: ANY
        value: any
    - name: TaskStatus
      description: The lifecycle state of a task.
      members:
      - name: PENDING
        value: pending
      - name: BLOCKED
        value: blocked
      - name: READY
        value: ready
      - name: IN_PROGRESS
        value: in_progress
      - name: REVIEW
        value: review
      - name: DONE
        value: done
      - name: CHANGES_REQUESTED
        value: changes_requested
      - name: SKIPPED
        value: skipped
      - name: DISCARDED
        value: discarded
    - name: RecurrenceType
      members:
      - name: ON_SUCCESS
        value: on_success
      - name: CRON
        value: cron
      - name: ON_FAILURE
        value: on_failure
    - name: ScopeLevel
      description: Defines the delegation level of the task, mapping directly to Agent
        roles and context boundaries.
      members:
      - name: PROJECT
        value: project
      - name: CONTEXT
        value: context
      - name: ARCHITECTURAL
        value: architectural
      - name: ATOMIC
        value: atomic
    - name: ArchitectureLayer
      description: DDD architecture layers.
      members:
      - name: DOMAIN
        value: domain
      - name: APPLICATION
        value: application
      - name: INFRASTRUCTURE
        value: infrastructure
      - name: INTERFACES
        value: interfaces
      - name: CROSS_CUTTING
        value: cross_cutting
      - name: NONE
        value: none
    value_objects:
    - name: ValueScore
      description: Numeric representation of business value.
      attributes:
      - type: float
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: float
          name: value
        output:
          type: ValueScore
      - name: __add__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: __radd__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: float
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: TaskOutput
      description: 任务执行者的交付物
      attributes:
      - type: string
        name: summary
      - type: string
        container: list
        name: artifacts
      - type: string
