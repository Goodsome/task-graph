- name: Shared
  domain:
    core:
    - name: ValueObject
      description: 值对象基类 特征： 1. 不可变（frozen=True） 2. 相等性基于所有属性值 3. 无唯一标识
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
    - name: AggregateRoot
      description: 聚合根基类 特征： 1. 继承 Entity 的所有特性 2. 管理领域事件的发布和收集 3. 确保聚合边界内的一致性
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
      - type: DomainEvent
        container: list
        name: _domain_events
      behaviors:
      - name: add_domain_event
        description: "添加领域事件\nArgs:\n    event: 要添加的领域事件实例\nRaises:\n    TypeError:\
          \ 如果 event 不是 DomainEvent 的实例"
        inputs:
        - type: Self
          name: self
        - type: DomainEvent
          name: event
        output:
          type: None
      - name: collect_events
        description: "收集并清空领域事件\nReturns:\n    收集到的所有领域事件列表（副本）"
        inputs:
        - type: Self
          name: self
        output:
          type: DomainEvent
          container: list
      - name: clear_events
        description: 清空领域事件
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: has_events
        description: "检查是否有未处理的领域事件\n\nReturns:\n    如果有事件返回 True，否则返回 False"
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    - name: Entity
      description: 实体基类 特征： 1. 具有唯一标识（ID） 2. 相等性基于 ID 判断 3. 可变（但应通过行为方法修改） 4. 使用 UTC
        时区记录时间
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
    ports:
    - name: Repository
      operations:
      - name: collect_seens
        inputs:
        - type: Self
          name: self
        output:
          type: T_AR
          container: set
      - name: add
        inputs:
        - type: Self
          name: self
        - type: T_AR
          name: aggregate
        output:
          type: None
      - name: get
        inputs:
        - type: Self
          name: self
        - type: T_ID
          name: id
        output:
          type: T_AR
      - name: save
        inputs:
        - type: Self
          name: self
        - type: T_AR
          name: aggregate
        output:
          type: None
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: T_ID
          name: id
        output:
          type: None
      - name: _add
        inputs:
        - type: Self
          name: self
        - type: T_AR
          name: aggregate
        output:
          type: None
      - name: _get
        inputs:
        - type: Self
          name: self
        - type: T_ID
          name: id
        output:
          type: T_AR
      - name: _save
        inputs:
        - type: Self
          name: self
        - type: T_AR
          name: aggregate
        output:
          type: None
      - name: _delete
        inputs:
        - type: Self
          name: self
        - type: T_ID
          name: id
        output:
          type: None
  application:
    ports:
    - name: EventPublisher
      description: Abstract port for publishing domain events.
      operations:
      - name: publish
        description: Publish a domain event.
        inputs:
        - type: Self
          name: self
        - type: DomainEvent
          name: event
        output:
          type: None
    - name: UnitOfWork
      operations:
      - name: repository
        inputs:
        - type: Self
          name: self
        output:
          type: T_Repo
      - name: event_publisher
        inputs:
        - type: Self
          name: self
        output:
          type: EventPublisher
      - name: __enter__
        inputs:
        - type: Self
          name: self
        output:
          type: Self
      - name: __exit__
        inputs:
        - type: Self
          name: self
        - type: BaseException
          container: type
          optional: true
          name: exc_type
        - type: BaseException
          optional: true
          name: exc_val
        - type: TracebackType
          optional: true
          name: exc_tb
        output:
          type: any
      - name: commit
        inputs:
        - type: Self
          name: self
        output:
          type: any
      - name: rollback
        inputs:
        - type: Self
          name: self
        output:
          type: any
