    services:
    - name: DependencyResolutionService
      operations:
      - name: evaluate_blocking_status
        description: "Evaluates whether a task is blocked based on its dependencies\
          \ and completion logic.\n\nReturns:\n    True if blocked (dependencies not\
          \ satisfied).\n    False if unblocked (ready to proceed)."
        inputs:
        - type: Self
          name: self
        - type: Task
          name: task
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: CycleDetectionService
      description: Ensures the planning graph remains a DAG.
      operations:
      - name: detect_cycle
        description: "Detects if adding a dependency (target -> new_dependency) would\
          \ create a cycle.\n\nLogic:\n    If we are adding a dependency where 'target'\
          \ depends on 'new_dependency',\n    a cycle exists if 'target' is already\
          \ an ancestor of 'new_dependency'.\n    We traverse up from 'new_dependency'\
          \ to see if we can reach 'target'."
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: target_task_id
        - type: TaskId
          name: new_dependency_id
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: PriorityAnalysisService
      description: Calculates dynamic priority (ROI) for all tasks.
      operations:
      - name: calculate_priorities
        description: "Orchestrates the calculation of Dynamic Priority for all active\
          \ tasks.\n\nAlgorithm:\n1. Load Graph: Fetch all active tasks.\n2. Forward\
          \ Propagation: Calculate Effective Effort (Cost to implement).\n   - For\
          \ OR nodes, takes the path of least resistance (Min).\n3. Backward Propagation:\
          \ Calculate Accumulated Value (Business Value).\n   - Value flows from Dependents\
          \ back to Dependencies.\n4. Score: ROI = Accumulated Value / Effective Effort."
        inputs:
        - type: Self
          name: self
        - type: TaskRepository
          name: repository
        - type: string
          optional: true
          name: project_id
        output:
          type: Task
          container: list
    ports:
    - name: TaskRepository
      description: Persistence interface for Tasks.
      kind: repository
      aggregate: Task
      operations:
      - name: save
        inputs:
        - type: Self
          name: self
        - type: Task
          name: task
        output:
          type: None
        rules:
        - name: save_persists_task_for_subsequent_retrieval
          given: a valid Task with a unique TaskId
          when: save is invoked with the Task
          then: the Task can be retrieved from the repository by its TaskId
        - name: save_is_idempotent_for_existing_task
          given: a Task already persisted in the repository
          when: save is invoked again with the same Task
          then: no error is raised and the Task state remains unchanged
        - name: save_preserves_task_dependencies
          given: a Task with a non-empty set of dependencies
          when: save is invoked with the Task
          then: the saved Task's dependencies are identical to the original set of
            TaskIds
      - name: get
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: Task
          optional: true
        rules:
        - name: get_returns_task_for_existing_id
          given: a Task with the given TaskId exists in the repository
          when: get is invoked with that TaskId
          then: the complete Task is returned with all its attributes intact
        - name: get_returns_none_for_nonexistent_id
          given: no Task with the given TaskId exists in the repository
          when: get is invoked with that TaskId
          then: None is returned without raising an error
        - name: get_returns_fully_reconstituted_task
          given: a Task was previously saved with all attributes populated
          when: get is invoked with the Task's TaskId
          then: the returned Task has identical attribute values including nested
            objects and value objects
      - name: find_all_active
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: project_id
        output:
          type: Task
          container: list
      - name: find_all
        inputs:
        - type: Self
          name: self
        output:
          type: Task
          container: list
      - name: find_dependents
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: Task
          container: list
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: Task
          optional: true
      - name: find_by_ids
        inputs:
        - type: Self
          name: self
        - type: TaskId
          container: set
          name: task_ids
        output:
          type: Task
          container: list
      - name: find_paged
        inputs:
        - type: Self
          name: self
        - type: integer
          name: page
        - type: integer
          name: page_size
        - type: TaskStatus
          optional: true
          name: status
        - type: string
          optional: true
          name: project_id
        - type: ScopeLevel
          optional: true
          name: scope_level
        - type: string
          optional: true
          name: search
        output:
          type: Any
          custom_type_string: tuple[list[Task], int]
