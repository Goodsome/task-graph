      - type: Session
        optional: true
        name: session
      - type: TaskRepository
        optional: true
        name: _tasks
      - type: EventBus
        optional: true
        name: _event_bus
    - name: SqlAlchemyTaskRepository
      implements: TaskRepository
      technology: sql
      description: SQLAlchemy implementation of TaskRepository.
      attributes:
      - type: Session
        name: session
