    ports:
    - name: TaskQueryService
      description: 'Read-only query interface for tasks (CQRS query side).


        Implementations must return lightweight DTOs rather than full domain

        aggregates to avoid loading unnecessary data and coupling queries to

        the domain model.'
      operations:
      - name: find_paged
        description: Return a paginated list of task summaries and the total count.
        inputs:
        - type: Self
          name: self
        - type: integer
          name: page
        - type: integer
          name: page_size
        - type: TaskStatus
          optional: true
          name: status
        - type: string
          optional: true
          name: project_id
        - type: ScopeLevel
          optional: true
          name: scope_level
        - type: string
          optional: true
          name: search
        output:
          type: Any
          custom_type_string: tuple[list[SummaryTask], int]
      - name: find_dependents
        description: Return summaries of all tasks that directly depend on *task_id*.
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: SummaryTask
          container: list
