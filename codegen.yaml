# yaml-language-server: $schema=./codegen.schema.json
name: TaskGraph
contexts:
- name: Bootstrap
- name: IssueTracking
  domain:
    aggregates:
    - name: Issue
      description: Issue aggregate root managing the complete issue lifecycle
      attributes:
      - type: IssueId
        name: id
      - type: string
        name: project_id
      - type: IssueTitle
        name: title
      - type: IssueDescription
        name: description
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: IssueStatus
        name: status
      - type: Submitter
        name: submitter
      - type: Label
        container: list
        name: labels
      - type: Comment
        container: list
        name: comments
      - type: TaskLink
        container: list
        name: task_links
      - type: datetime
        name: created_at
      - type: datetime
        name: updated_at
      behaviors:
      - name: __hash__
        inputs:
        - type: Self
          name: self
        output:
          type: integer
      - name: create
        description: Create a new Issue aggregate
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: project_id
        - type: string
          name: title
        - type: string
          name: description
        - type: IssueType
          name: issue_type
        - type: Severity
          name: severity
        - type: Submitter
          name: submitter
        output:
          type: Self
      - name: change_status
        description: Change issue status with audit trail
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: new_status
        - type: string
          name: changed_by
        output:
          type: None
      - name: close
        description: Close the issue with optional resolution note
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: resolution
        output:
          type: None
      - name: add_comment
        description: Add a comment to the issue
        inputs:
        - type: Self
          name: self
        - type: string
          name: content
        - type: string
          name: author
        output:
          type: Comment
      - name: add_label
        description: Add a label to the issue (duplicates ignored)
        inputs:
        - type: Self
          name: self
        - type: Label
          name: label
        output:
          type: None
      - name: remove_label
        description: Remove a label from the issue by name
        inputs:
        - type: Self
          name: self
        - type: string
          name: label_name
        output:
          type: None
      - name: link_to_task
        description: Link this issue to a planning task
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: TaskLink
      - name: unlink_from_task
        description: Remove link to a planning task
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: None
      - name: update_metadata
        description: Update issue type and/or severity
        inputs:
        - type: Self
          name: self
        - type: IssueType
          optional: true
          name: issue_type
        - type: Severity
          optional: true
          name: severity
        output:
          type: None
    enums:
    - name: IssueType
      description: Classification of issue types
      members:
      - name: BUG
        value: bug
      - name: FEATURE
        value: feature
      - name: QUESTION
        value: question
      - name: IMPROVEMENT
        value: improvement
    - name: Severity
      description: Severity level of an issue
      members:
      - name: CRITICAL
        value: critical
      - name: MAJOR
        value: major
      - name: MINOR
        value: minor
      - name: LOW
        value: low
    - name: IssueStatus
      description: Lifecycle state of an issue
      members:
      - name: REPORTED
        value: reported
      - name: TRIAGED
        value: triaged
      - name: IN_PROGRESS
        value: in_progress
      - name: RESOLVED
        value: resolved
      - name: CLOSED
        value: closed
    value_objects:
    - name: IssueTitle
      description: Title of an issue, max 200 characters
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: Create a new IssueTitle instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: IssueTitle
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: CommentId
      description: Unique identifier for a Comment
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: Self
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: UUID | str
          name: value
        output:
          type: Self
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: IssueDescription
      description: Description of an issue, max 10000 characters
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: Create a new IssueDescription instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: IssueDescription
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: Label
      description: Label for categorizing issues
      attributes:
      - type: string
        name: name
      behaviors:
      - name: create
        description: Create a new Label instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        output:
          type: Label
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: IssueId
      description: Unique identifier for an Issue
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        description: Create a new IssueId with a random UUID
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: IssueId
      - name: reconstitute
        description: Reconstruct an IssueId from a UUID or string
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: UUID | str
          name: value
        output:
          type: IssueId
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: TaskLink
      description: Link between an Issue and a Task from Planning context
      attributes:
      - type: TaskId
        name: task_id
      - type: datetime
        name: linked_at
      behaviors:
      - name: create
        description: Create a new TaskLink instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: TaskId | str
          name: task_id
        output:
          type: TaskLink
      - name: validate_from_orm
        description: Support converting ORM models to TaskLink
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: dict | object
          name: data
        output:
          type: dict
    - name: Submitter
      description: Information about the issue submitter
      attributes:
      - type: string
        name: name
      behaviors:
      - name: create
        description: Create a new Submitter instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: name
        output:
          type: Self
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    entities:
    - name: Comment
      description: Comment attached to an Issue, immutable after creation
      attributes:
      - type: CommentId
        name: id
      - type: string
        name: content
      - type: string
        name: author
      - type: datetime
        name: created_at
      behaviors:
      - name: create
        description: Create a new Comment instance
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: content
        - type: string
          name: author
        output:
          type: Self
      - name: validate_primitive_types
        description: Convert primitive types to proper value objects when reconstructing
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: dict | object
          name: data
        output:
          type: dict
    services:
    - name: IssueStatusTransitionService
      description: Validates issue status transitions according to state machine rules
      operations:
      - name: can_transition
        description: Check if transition from current_status to target_status is allowed
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: current_status
        - type: IssueStatus
          name: target_status
        output:
          type: boolean
      - name: validate_transition
        description: Validate transition, raise ValueError if invalid
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          name: current_status
        - type: IssueStatus
          name: target_status
        output:
          type: None
    ports:
    - name: IssueRepository
      description: Persistence interface for Issue aggregate
      operations:
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: IssueId
          name: issue_id
        output:
          type: Issue
          optional: true
        rules:
        - name: find_existing_issue_by_id
          given: 传入的issue_id对应的Issue在数据库中存在
          when: 调用find_by_id方法
          then: 返回对应的Issue聚合根实例
        - name: find_non_existent_issue_by_id
          given: 传入的issue_id对应的Issue在数据库中不存在
          when: 调用find_by_id方法
          then: 返回None
      - name: find_all
        inputs:
        - type: Self
          name: self
        - type: integer
          name: limit
        - type: integer
          name: offset
        - type: IssueStatus
          optional: true
          name: status
        - type: IssueType
          optional: true
          name: issue_type
        - type: Severity
          optional: true
          name: severity
        - type: string
          container: list
          optional: true
          name: labels
        - type: string
          optional: true
          name: project_id
        output:
          type: Issue
          container: list
        rules:
        - name: find_all_issues_with_pagination
          given: 传入limit和offset参数，其他过滤参数为空
          when: 调用find_all方法
          then: 返回按分页参数查询到的Issue列表，不应用任何过滤条件
        - name: find_issues_filtered_by_status
          given: 传入status过滤参数
          when: 调用find_all方法
          then: 返回符合指定状态的Issue列表
        - name: find_issues_with_multiple_filters
          given: 传入多个过滤参数（如status、issue_type、severity、labels）
          when: 调用find_all方法
          then: 返回同时满足所有过滤条件的Issue列表
        - name: find_issues_no_matches
          given: 过滤条件没有匹配的Issue
          when: 调用find_all方法
          then: 返回空列表
      - name: find_by_task_id
        inputs:
        - type: Self
          name: self
        - type: string
          name: task_id
        output:
          type: Issue
          container: list
        rules:
        - name: find_issues_linked_to_task
          given: 传入有效的task_id
          when: 调用find_by_task_id方法
          then: 返回所有与该task_id关联的Issue列表
        - name: find_issues_no_linked_to_task
          given: 传入的task_id没有关联任何Issue
          when: 调用find_by_task_id方法
          then: 返回空列表
      - name: count
        inputs:
        - type: Self
          name: self
        - type: IssueStatus
          optional: true
          name: status
        - type: IssueType
          optional: true
          name: issue_type
        output:
          type: integer
        rules:
        - name: count_all_issues
          given: 不传入任何过滤参数
          when: 调用count方法
          then: 返回数据库中所有Issue的总数量
        - name: count_issues_with_filters
          given: 传入status或issue_type过滤参数
          when: 调用count方法
          then: 返回符合过滤条件的Issue数量
      - name: find_paged
        description: 'Find paginated issues with filtering and return both the list
          and total count.

          This ensures consistency between the returned list and count by using the
          same filters.'
        inputs:
        - type: Self
          name: self
        - type: integer
          name: limit
        - type: integer
          name: offset
        - type: IssueStatus
          optional: true
          name: status
        - type: IssueType
          optional: true
          name: issue_type
        - type: Severity
          optional: true
          name: severity
        - type: string
          container: list
          optional: true
          name: labels
        - type: string
          optional: true
          name: project_id
        output:
          type: Any
          custom_type_string: tuple[list[Issue], int]
    domain_events:
    - name: IssueStatusChanged
      description: Event emitted when an issue's status is changed.
      attributes:
      - type: string
        name: issue_id
      - type: IssueStatus
        name: old_status
      - type: IssueStatus
        name: new_status
      - type: string
        name: changed_by
    - name: IssueCommentAdded
      description: Event emitted when a new comment is added to an issue.
      attributes:
      - type: string
        name: issue_id
      - type: string
        name: comment_id
      - type: string
        name: author
      - type: string
        name: content
    - name: IssueCreated
      description: Event emitted when a new issue is reported.
      attributes:
      - type: string
        name: issue_id
      - type: string
        name: project_id
      - type: string
        name: title
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: string
        name: submitter_name
    - name: IssueClosed
      description: Event emitted when an issue is closed.
      attributes:
      - type: string
        name: issue_id
      - type: string
        optional: true
        name: resolution
  application:
    use_cases:
    - name: LinkIssueToTask
      kind: command
      description: Link an issue to a task from Planning context
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    - name: CloseIssue
      kind: command
      description: Close an issue that is in RESOLVED status
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    - name: UpdateIssueStatus
      kind: command
      description: Update issue status with state machine validation
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
      - type: IssueStatusTransitionService
        name: status_transition_service
    - name: GetIssueDetails
      kind: query
      description: Get full issue details including comments and labels
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    - name: CreateIssue
      kind: command
      description: Create a new issue with initial status NEW
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    - name: UpdateIssueMetadata
      kind: command
      description: Update issue metadata like type, severity, and labels
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    - name: ListIssues
      kind: query
      description: Paginated list of issues with filtering
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    - name: UnlinkIssueFromTask
      kind: command
      description: Unlink an issue from a task
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    - name: AddComment
      kind: command
      description: Add a comment to an issue
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[IssueRepository]
        name: uow
    dtos:
    - name: IssueSummaryDTO
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: id
      - type: string
        name: project_id
      - type: string
        name: title
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: IssueStatus
        name: status
      - type: string
        name: submitter_name
      - type: integer
        name: comment_count
      - type: integer
        name: label_count
      - type: integer
        name: task_link_count
      - type: datetime
        name: created_at
      - type: datetime
        name: updated_at
    - name: GetIssueDetailsResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: IssueDetailsDTO
        optional: true
        name: issue
      - type: string
        name: error
        default: ''
    - name: CreateIssueCommand
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: project_id
      - type: string
        name: title
      - type: string
        name: description
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: string
        name: submitter_name
    - name: UpdateIssueStatusResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
    - name: UnlinkIssueFromTaskResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
    - name: CreateIssueResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: string
        name: issue_id
      - type: string
        name: error
        default: ''
    - name: CloseIssueResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
    - name: SubmitterDTO
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: name
    - name: TaskLinkDTO
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: task_id
      - type: datetime
        name: linked_at
    - name: UpdateIssueMetadataCommand
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: issue_id
      - type: IssueType
        optional: true
        name: type
      - type: Severity
        optional: true
        name: severity
      - type: string
        container: list
        optional: true
        name: add_labels
      - type: string
        container: list
        optional: true
        name: remove_labels
    - name: IssueDetailsDTO
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: id
      - type: string
        name: project_id
      - type: string
        name: title
      - type: string
        name: description
      - type: IssueType
        name: type
      - type: Severity
        name: severity
      - type: IssueStatus
        name: status
      - type: SubmitterDTO
        name: submitter
      - type: LabelDTO
        container: list
        name: labels
      - type: CommentDTO
        container: list
        name: comments
      - type: TaskLinkDTO
        container: list
        name: task_links
      - type: datetime
        name: created_at
      - type: datetime
        name: updated_at
    - name: AddCommentResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: string
        name: comment_id
      - type: string
        name: error
        default: ''
    - name: CommentDTO
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: id
      - type: string
        name: content
      - type: string
        name: author
      - type: datetime
        name: created_at
    - name: UpdateIssueStatusCommand
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: issue_id
      - type: IssueStatus
        name: new_status
      - type: string
        name: changed_by
    - name: ListIssuesQuery
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: IssueStatus
        optional: true
        name: status
      - type: IssueType
        optional: true
        name: type
      - type: Severity
        optional: true
        name: severity
      - type: string
        container: list
        optional: true
        name: labels
      - type: string
        optional: true
        name: project_id
      - type: integer
        name: limit
        default: 10
      - type: integer
        name: offset
        default: 0
    - name: LinkIssueToTaskResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
    - name: ListIssuesResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: IssueSummaryDTO
        container: list
        name: issues
      - type: integer
        name: total_count
      - type: string
        name: error
        default: ''
    - name: GetIssueDetailsQuery
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: issue_id
    - name: AddCommentCommand
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: issue_id
      - type: string
        name: content
      - type: string
        name: author
    - name: LinkIssueToTaskCommand
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: issue_id
      - type: string
        name: task_id
    - name: UpdateIssueMetadataResult
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: boolean
        name: success
      - type: string
        name: error
        default: ''
    - name: LabelDTO
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: name
    - name: UnlinkIssueFromTaskCommand
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: issue_id
      - type: string
        name: task_id
    - name: CloseIssueCommand
      description: ''
      base_types:
      - BaseModel
      attributes:
      - type: string
        name: issue_id
      - type: string
        optional: true
        name: resolution
  infrastructure:
    implementations:
    - name: SqlAlchemyIssueRepository
      implements: IssueRepository
      technology: sql
      description: SQLAlchemy implementation of IssueRepository
      attributes:
      - type: Session
        name: session
  interfaces:
    mcp_tools:
    - name: link_issue_to_task
      use_case: LinkIssueToTask
    - name: close_issue
      use_case: CloseIssue
    - name: update_issue_status
      use_case: UpdateIssueStatus
    - name: get_issue_details
      use_case: GetIssueDetails
    - name: create_issue
      use_case: CreateIssue
    - name: update_issue_metadata
      use_case: UpdateIssueMetadata
    - name: list_issues
      use_case: ListIssues
    - name: unlink_issue_from_task
      use_case: UnlinkIssueFromTask
    - name: add_comment
      use_case: AddComment
- name: Planning
  domain:
    core:
    - name: BaseTaskEvent
      description: Task 领域模型的基础类，包含所有公共上下文信息
      attributes:
      - type: string
        name: task_id
      - type: string
        name: project_id
      - type: ScopeLevel
        name: scope_level
      - type: string
        optional: true
        name: bounded_context
      - type: ArchitectureLayer
        optional: true
        name: architecture_layer
      - type: string
        optional: true
        name: parent_id
    aggregates:
    - name: Task
      description: The atomic unit of planning, representing a node in the DAG.
      attributes:
      - type: TaskId
        name: id
      - type: string
        name: project_id
      - type: string
        name: name
      - type: string
        name: description
      - type: TaskStatus
        name: status
      - type: CompletionLogic
        name: completion_logic
      - type: StoryPoint
        name: effort
      - type: ValueScore
        name: base_value
      - type: TaskId
        container: set
        name: dependencies
      - type: ScopeLevel
        name: scope_level
      - type: ScopeContext
        optional: true
        name: scope_context
      - type: TaskId
        optional: true
        name: parent_id
      - type: RecurrencePolicy
        optional: true
        name: recurrence
      - type: TaskOutput
        optional: true
        name: output
      - type: ReviewFeedback
        optional: true
        name: review_feedback
      - type: Scenario
        container: list
        name: acceptance_criteria
        default: list
      behaviors:
      - name: __hash__
        inputs:
        - type: Self
          name: self
        output:
          type: integer
      - name: create
        description: Factory method to create a new Task
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: project_id
        - type: string
          name: name
        - type: string
          name: description
        - type: StoryPoint
          name: effort
        - type: ValueScore
          name: base_value
        - type: TaskId
          container: set
          name: dependencies
        - type: ScopeLevel
          name: scope_level
        - type: CompletionLogic
          name: completion_logic
          default: CompletionLogic.ALL
        - type: TaskId
          optional: true
          name: parent_id
        - type: ScopeContext
          optional: true
          name: scope_context
        - type: Scenario
          container: list
          optional: true
          name: acceptance_criteria
        output:
          type: Self
      - name: mark_ready
        description: "将任务标记为 READY（依赖已满足，可被领取）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 PENDING 或 BLOCKED"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: mark_pending
        description: "将任务标记为 PENDING（新增了未满足的依赖）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不是 READY"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: claim
        description: "领取任务开始执行。\n\nRaises:\n    TaskNotClaimableError: 当前状态不是 READY\
          \ 或 CHANGES_REQUESTED"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: set_output
        description: "设置任务执行结果。\n\nRaises:\n    IllegalStateTransitionError: 当前状态不是\
          \ IN_PROGRESS"
        inputs:
        - type: Self
          name: self
        - type: TaskOutput
          name: output
        output:
          type: None
      - name: mark_blocked
        description: "标记任务被阻塞。\n\nArgs:\n    reason: 阻塞原因\nRaises:\n    IllegalStateTransitionError:\
          \ 如果当前状态不是 IN_PROGRESS"
        inputs:
        - type: Self
          name: self
        - type: string
          name: reason
        output:
          type: None
      - name: mark_reviewing
        description: "标记任务进入审核状态。\n\nRaises:\n    IllegalStateTransitionError: 如果当前状态不是\
          \ IN_PROGRESS"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: mark_completed
        description: "直接标记任务完成（用于手动/自动完成场景）。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 当前状态不允许直接完成"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: review
        description: "验证任务并记录反馈。\n\nArgs:\n    approved: 是否通过\n    feedback: 详细评价意见\n\
          Raises:\n    IllegalStateTransitionError: 如果当前状态不是 REVIEWING"
        inputs:
        - type: Self
          name: self
        - type: boolean
          name: approved
        - type: string
          name: feedback
        output:
          type: None
      - name: generate_sub_tasks
        description: "根据输出中的 sub_tasks 生成子任务。\n\nReturns:\n    list[Task]: 生成的子任务列表\n\
          Raises:\n    IllegalStateTransitionError: 只有 DECOMPOSING 状态可以生成子任务"
        inputs:
        - type: Self
          name: self
        output:
          type: Task
          container: list
        rules:
        - name: implicit_serial_dependency_when_no_explicit
          given: SubTaskInfo 列表中所有子任务均未设置 dependencies
          when: 调用 generate_sub_tasks() 方法
          then: 第一个子任务无依赖且状态为 READY，后续每个子任务隐式依赖列表中前一个子任务
        - name: explicit_dependency_resolved_by_name
          given: 子任务 Frontend 的 dependencies 包含 {Backend}，Backend 无依赖
          when: 调用 generate_sub_tasks() 方法
          then: Frontend 的 dependencies 应包含 Backend 对应的 TaskId 且状态为 BLOCKED
        - name: mixed_explicit_and_implicit_dependency
          given: 子任务列表为 [A, B, C]，B 显式依赖 A，C 未设置 dependencies
          when: 调用 generate_sub_tasks() 方法
          then: A 无依赖状态为 READY，B 显式依赖 A 状态为 BLOCKED，C 隐式依赖 B 状态为 BLOCKED
        - name: invalid_dependency_name_raises_error
          given: 子任务 Frontend 的 dependencies 包含不存在的子任务名 NonExistent
          when: 调用 generate_sub_tasks() 方法
          then: 应抛出 ValueError 提示依赖的子任务名不存在
        - name: first_subtask_ready_without_explicit_dependency
          given: 第一个子任务未设置 dependencies 且列表中存在后续子任务
          when: 调用 generate_sub_tasks() 方法
          then: 第一个子任务的 dependencies 为空且状态为 READY
        - name: two_phase_processing_with_name_to_id_mapping
          given: 包含多个 SubTaskInfo 的列表
          when: 调用 generate_sub_tasks() 方法
          then: 第一阶段创建所有 Task 实例并建立 name 到 TaskId 的映射表，第二阶段解析 dependencies 中的 name
            为对应 TaskId
      - name: _create_child_task
        description: 创建单个子任务实例（第一阶段辅助方法）。
        inputs:
        - type: Self
          name: self
        - type: SubTaskInfo
          name: sub_info
        - type: ScopeLevel
          name: child_scope_level
        output:
          type: Task
      - name: _resolve_sub_task_dependencies
        description: "解析子任务的依赖关系（第二阶段辅助方法）。\n\n显式依赖: 通过 SubTaskInfo.dependencies 中的\
          \ name 查找对应的 TaskId。\n隐式依赖: 无显式依赖且非第一个子任务时，隐式依赖列表中的前一个子任务。\n\nRaises:\n\
          \    ValueError: 当显式依赖的 name 在子任务列表中不存在时"
        inputs:
        - type: Self
          name: self
        - type: SubTaskInfo
          name: sub_info
        - type: Task
          container: list
          name: all_sub_tasks
        - type: Task
          name: current_task
        - type: Task
          container: map
          name: name_to_task
        output:
          type: TaskId
          container: set
      - name: mark_decomposition_completed
        description: "标记任务分解完成。\n\nRaises:\n    IllegalStateTransitionError: 如果当前状态不是\
          \ DECOMPOSING 或 DELEGATED"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: mark_delegated
        description: "标记任务已分解并委派子任务。\n\nRaises:\n    IllegalStateTransitionError:\
          \ 如果当前状态不是 DECOMPOSING"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: mark_changes_requested
        description: "标记任务需要修改。\n\nArgs:\n    feedback: 审核反馈意见\nRaises:\n    IllegalStateTransitionError:\
          \ 如果当前状态不是 REVIEWING"
        inputs:
        - type: Self
          name: self
        - type: string
          name: feedback
        output:
          type: None
      - name: mark_decomposing
        description: "标记任务需要分解。\n\nRaises:\n    IllegalStateTransitionError: 如果当前状态不是\
          \ REVIEWING"
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: is_done
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
      - name: _build_task_event
        description: 内部辅助方法：统一构造 Task 相关的领域事件，处理基础属性的映射和展平。
        inputs:
        - type: Self
          name: self
        - type: T
          container: type
          name: event_class
        - type: string
          optional: true
          name: reason
        - type: string
          optional: true
          name: feedback
        output:
          type: T
      - name: is_claimable
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    enums:
    - name: CompletionLogic
      description: Rules defining how a task is unlocked based on its dependencies.
      members:
      - name: ALL
        value: all
      - name: ANY
        value: any
    - name: TaskStatus
      description: The lifecycle state of a task.
      members:
      - name: PENDING
        value: pending
      - name: BLOCKED
        value: blocked
      - name: READY
        value: ready
      - name: IN_PROGRESS
        value: in_progress
      - name: REVIEWING
        value: reviewing
      - name: DECOMPOSING
        value: decomposing
      - name: DELEGATED
        value: delegated
      - name: DONE
        value: done
      - name: CHANGES_REQUESTED
        value: changes_requested
      - name: SKIPPED
        value: skipped
      - name: DISCARDED
        value: discarded
    - name: RecurrenceType
      members:
      - name: ON_SUCCESS
        value: on_success
      - name: CRON
        value: cron
      - name: ON_FAILURE
        value: on_failure
    - name: ScopeLevel
      description: Defines the delegation level of the task, mapping directly to Agent
        roles and context boundaries.
      members:
      - name: PROJECT
        value: project
      - name: CONTEXT
        value: context
      - name: ARCHITECTURE
        value: architecture
      - name: COMPONENT
        value: component
    - name: ArchitectureLayer
      description: DDD architecture layers.
      members:
      - name: DOMAIN
        value: domain
      - name: APPLICATION
        value: application
      - name: INFRASTRUCTURE
        value: infrastructure
      - name: INTERFACES
        value: interfaces
      - name: CROSS_CUTTING
        value: cross_cutting
      - name: NONE
        value: none
    - name: GherkinKeyword
      description: Gherkin 语法关键字，用于 BDD 场景步骤的语义标注。
      members:
      - name: GIVEN
        value: given
      - name: WHEN
        value: when
      - name: THEN
        value: then
      - name: AND
        value: and
      - name: BUT
        value: but
    value_objects:
    - name: ValueScore
      description: Numeric representation of business value.
      attributes:
      - type: float
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: float
          name: value
        output:
          type: ValueScore
      - name: __add__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: __radd__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: float
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: SubTaskInfo
      description: 要拆分的子任务信息
      attributes:
      - type: string
        name: name
      - type: string
        name: description
      - type: StoryPoint
        name: effort
      - type: ValueScore
        name: base_value
      - type: Scenario
        container: list
        name: acceptance_criteria
        default: list
      - type: string
        container: set
        name: dependencies
        default: set
    - name: TaskOutput
      description: 任务执行者的交付物
      attributes:
      - type: string
        name: summary
      - type: string
        container: list
        name: artifacts
      - type: string
        optional: true
        name: error
      - type: SubTaskInfo
        container: list
        optional: true
        name: sub_tasks
    - name: ScopeContext
      description: Value object containing context information related to the task's
        scope level.
      attributes:
      - type: string
        optional: true
        name: bounded_context
      - type: ArchitectureLayer
        optional: true
        name: architecture_layer
      - type: string
        optional: true
        name: component_name
      - type: string
        optional: true
        name: atomic_name
      behaviors:
      - name: create
        description: Factory method to create a new ScopeContext instance.
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          optional: true
          name: bounded_context
        - type: ArchitectureLayer
          optional: true
          name: architecture_layer
        - type: string
          optional: true
          name: component_name
        output:
          type: Self
    - name: RecurrencePolicy
      description: Rules for creating a successor task upon completion.
      attributes:
      - type: RecurrenceType
        name: type
      - type: integer
        name: max_repetitions
        default: int
      - type: integer
        name: current_iteration
      behaviors:
      - name: next_iteration
        inputs:
        - type: Self
          name: self
        output:
          type: RecurrencePolicy
    - name: Scenario
      description: Gherkin 场景，由名称和有序步骤列表组成。
      attributes:
      - type: string
        name: name
      - type: GherkinStep
        container: list
        name: steps
        default: list
    - name: StoryPoint
      description: Encapsulated Fibonacci number representing effort (1, 2, 3, 5,
        8, 13...).
      attributes:
      - type: integer
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        - type: integer
          name: effort
        output:
          type: StoryPoint
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: integer
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
      - name: validate_fibonacci
        inputs:
        - type: Self
          container: type
          name: cls
        - type: integer
          name: v
        output:
          type: integer
      - name: __add__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: __radd__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
      - name: __lt__
        inputs:
        - type: Self
          name: self
        - type: any
          name: other
        output:
          type: any
    - name: ReviewFeedback
      description: 任务规划者的验收意见
      attributes:
      - type: string
        name: comment
      - type: string
        name: decision
    - name: GherkinStep
      description: Gherkin 场景中的单一步骤，由关键字和步骤文本组成。
      attributes:
      - type: GherkinKeyword
        name: keyword
      - type: string
        name: text
    - name: TaskId
      description: Unique identifier for a Task.
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: UUID | str
          name: value
        output:
          type: any
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: any
      - name: __hash__
        inputs:
        - type: Self
          name: self
        output:
          type: integer
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    services:
    - name: DependencyResolutionService
      operations:
      - name: evaluate_blocking_status
        description: "Evaluates whether a task is blocked based on its dependencies\
          \ and completion logic.\n\nReturns:\n    True if blocked (dependencies not\
          \ satisfied).\n    False if unblocked (ready to proceed)."
        inputs:
        - type: Self
          name: self
        - type: Task
          name: task
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: CycleDetectionService
      description: Ensures the planning graph remains a DAG.
      operations:
      - name: detect_cycle
        description: "Detects if adding a dependency (target -> new_dependency) would\
          \ create a cycle.\n\nLogic:\n    If we are adding a dependency where 'target'\
          \ depends on 'new_dependency',\n    a cycle exists if 'target' is already\
          \ an ancestor of 'new_dependency'.\n    We traverse up from 'new_dependency'\
          \ to see if we can reach 'target'."
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: target_task_id
        - type: TaskId
          name: new_dependency_id
        - type: TaskRepository
          name: repository
        output:
          type: boolean
    - name: PriorityAnalysisService
      description: Calculates dynamic priority (ROI) for all tasks.
      operations:
      - name: calculate_priorities
        description: "Orchestrates the calculation of Dynamic Priority for all active\
          \ tasks.\n\nAlgorithm:\n1. Load Graph: Fetch all active tasks.\n2. Forward\
          \ Propagation: Calculate Effective Effort (Cost to implement).\n   - For\
          \ OR nodes, takes the path of least resistance (Min).\n3. Backward Propagation:\
          \ Calculate Accumulated Value (Business Value).\n   - Value flows from Dependents\
          \ back to Dependencies.\n4. Score: ROI = Accumulated Value / Effective Effort."
        inputs:
        - type: Self
          name: self
        - type: TaskRepository
          name: repository
        - type: string
          optional: true
          name: project_id
        output:
          type: Task
          container: list
    ports:
    - name: TaskRepository
      description: Persistence interface for Tasks.
      operations:
      - name: find_all_active
        inputs:
        - type: Self
          name: self
        - type: string
          optional: true
          name: project_id
        output:
          type: Task
          container: list
      - name: find_by_ids
        inputs:
        - type: Self
          name: self
        - type: TaskId
          container: set
          name: task_ids
        output:
          type: Task
          container: list
      - name: find_by_parent_id
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: parent_id
        output:
          type: Task
          container: list
    domain_events:
    - name: TaskCreated
      description: Event emitted when a new task is created.
      base_types:
      - BaseTaskEvent
    - name: TaskChangesRequested
      description: Event emitted when a task review is rejected and changes are requested.
      base_types:
      - BaseTaskEvent
      attributes:
      - type: string
        name: feedback
    - name: TaskDelegated
      description: Event emitted when a task has been decomposed and sub-tasks are
        created.
      base_types:
      - BaseTaskEvent
    - name: TaskInProgress
      description: Event emitted when a task is claimed and starts execution.
      base_types:
      - BaseTaskEvent
    - name: TaskBlocked
      description: Event emitted when a task is blocked (e.g., execution error).
      base_types:
      - BaseTaskEvent
      attributes:
      - type: string
        name: reason
    - name: TaskDecomposing
      description: Event emitted when a task is approved for decomposition.
      base_types:
      - BaseTaskEvent
    - name: TaskReady
      description: Event emitted when a task is ready to be claimed.
      base_types:
      - BaseTaskEvent
    - name: TaskReviewRequested
      description: Event emitted when a task is submitted for review.
      base_types:
      - BaseTaskEvent
    - name: TaskCompleted
      description: Event emitted when a task is completed.
      base_types:
      - BaseTaskEvent
  application:
    use_cases:
    - name: SubmitTaskResult
      kind: command
      description: Submit task execution result with artifacts and optional error.
        Updates task.output.
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
    - name: CreateTask
      kind: command
      description: Create task
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
    - name: CompleteDelegatedTask
      kind: command
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
    - name: UpdateTaskStatus
      kind: command
      description: Updates a task's status and triggers chain reactions for dependents.
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
      - type: DependencyResolutionService
        name: resolution_service
    - name: DecomposeTask
      kind: command
      description: 'Decompose a task into sub-tasks.


        This use case:

        1. Retrieves the task by ID.

        2. Generates sub-tasks based on the task''s output.

        3. Persists the new sub-tasks.

        4. Marks the original task as DELEGATED.

        5. Persists the original task.'
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
    - name: SuggestNextAction
      kind: query
      description: Returns the highest priority tasks that are ready to execute.
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
      - type: PriorityAnalysisService
        name: priority_service
    - name: GetTaskDetails
      kind: query
      description: Use case to get details of a specific task.
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
    - name: ReviewTask
      kind: command
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
    - name: DeleteTask
      kind: command
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
    - name: UnlockTask
      kind: command
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
      - type: DependencyResolutionService
        name: resolution_service
    - name: ModifyTaskDependencies
      kind: command
      dependencies:
      - type: Any
        custom_type_string: UnitOfWork[TaskRepository]
        name: uow
      - type: CycleDetectionService
