[project]
name = "task-graph"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.48.3",
    "fastmcp>=3.2.3",
    "httpx[socks]>=0.28.1",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "sqlalchemy[asyncio]>=2.0.46",
    "textual>=1.0.0",
    "typer>=0.24.1",
]

[project.scripts]
task-graph = "task_graph.entrypoints.cli:main"
task-graph-mcp = "task_graph.entrypoints.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "polyfactory>=3.3.0",
    "pytest>=9.0.2",
    "ruff>=0.15.10",
]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
